          type: string
        deferred_until:
          description: Required when it is deferred. A date, as 2026-03-31
          type: string
        extends:
          description: An approved claim at the same component and consumer to carry to this issue. The outcome and justification must match it; the new claim is recorded as an extension of it and still needs a second person
          format: int64
          type: integer
        justification:
          description: Why it does not apply. Required when it does not
          enum:
            - component_not_present
            - vulnerable_code_not_present
            - vulnerable_code_not_in_execute_path
            - vulnerable_code_cannot_be_controlled_by_adversary
            - inline_mitigations_already_exist
          type: string
        mitigation:
          description: What actually stops it — the rule, the setting, the service that is not exposed. Required when the reason is that mitigations already exist, and refused with any other
          type: string
        outcome:
          enum:
            - affected
            - not-applicable
            - deferred
            - wont-fix
          type: string
        places:
          description: Which places this covers, as the finding names them. Omit for all of them
          items:
            type: string
          type:
            - array
            - "null"
        reasoning:
          description: Why this holds
          minLength: 1
          type: string
        remaining:
          description: Decide only the places nothing currently stands at, and leave the rest as they are. For applying a decision to another build, where some of its places are already reached by lookup
          type: boolean

          description: How many distinct ways down there are. More than one means the pair above is one of them
          format: int64
          type: integer
        component:
          description: What carries it
          type: string
        ecosystem:
          description: "The kind of package, as its identifier spells it: deb, golang, cargo, pypi, generic, oci, github, maven. With the component and version it tells one row from another, which those two alone do not: one build can hold one name at one version as two components, a source repository and the package built from it"
          type: string
        exploited:
          description: Somebody is known to be exploiting this
          type: boolean
        fix_state:
          description: What upstream has done about it
          enum:
            - fixed
            - none
            - wont-fix
          type: string
        fixed_in:
          description: The version that resolves it, where one exists
          type: string
        likelihood:
          description: Published estimate that this will be exploited, 0 to 1
          format: double
          type: number
        middle:
          description: How many steps sit between those two
          format: int64
          type: integer
        owner:
          description: The part of the product this belongs to. Absent where the inventory placed the component nowhere
          type: string
        parent:
          description: What directly pulls it in, which is what a decision is about
          type: string
        places:
          description: How many places this component sits at here
          format: int64
          type: integer
        score:
          description: The severity as a number, which is what the order compares
          format: double
          type: number
        sent_back:
          description: A live claim at one of these places is currently with its author, sent back for more
          type: boolean
        severity:
          description: As the scanner rated it. A word, not a score
          type: string
        state:
          description: "How far this has been decided: undecided when no place has a decision of any kind, waiting when a claim stands proposed and nobody has agreed, agreed when every place is answered by a standing decision, lapsed when a decision here stopped applying and nothing replaced it. Absent where some places are approved and the rest never decided"
          enum:
            - undecided
            - waiting
            - agreed
            - lapsed
          type: string
        upstream:
          description: What a fork was made from, where it is one
          type: string
        version:
          description: The version that ships
          type: string
        vulnerability:
          description: The issue, under the name it is most widely known by
          type: string
      required:
        - vulnerability
        - component
        - version
        - places
      type: object
    FindingDecisionBody:
      additionalProperties: false

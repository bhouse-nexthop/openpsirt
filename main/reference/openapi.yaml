components:
  schemas:
    Acknowledge-all-notificationsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Acknowledge-all-notificationsResponse.json
          format: uri
          readOnly: true
          type: string
        acknowledged:
          description: How many were waiting
          format: int64
          type: integer
      required:
        - acknowledged
      type: object
    ApprovalBody:
      additionalProperties: false
      properties:
        approved_at:
          type: string
        approved_by:
          type: string
        batch:
          description: The batch it was approved under, if it was a bulk approval
          type: string
        covered:
          description: Findings this covered when it was agreed to
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        revision_id:
          description: Which revision of the justification was agreed to
          format: int64
          type: integer
        withdrawn_at:
          description: When this approval was taken back, if it was
          type: string
      required:
        - id
        - revision_id
        - approved_by
        - approved_at
      type: object
    Approve-decisionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Approve-decisionRequest.json
          format: uri
          readOnly: true
          type: string
        batch:
          description: Name a batch to agree to many at once, so it can be undone as one
          type: string
      type: object
    AroundBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AroundBody.json
          format: uri
          readOnly: true
          type: string
        above:
          description: What pulls this in — usually short, and the direction people use
          items:
            $ref: "#/components/schemas/NeighbourBody"
          type:
            - array
            - "null"
        below:
          description: What it pulls in
          items:
            $ref: "#/components/schemas/NeighbourBody"
          type:
            - array
            - "null"
      required:
        - above
        - below
      type: object
    AssessmentBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AssessmentBody.json
          format: uri
          readOnly: true
          type: string
        id:
          format: int64
          type: integer
        in_products:
          description: How many products those sit in
          format: int64
          type: integer
        needs_approval:
          description: Whether a second person has to agree before it takes effect
          type: boolean
        off_the_list:
          description: How many of them this rating would put below their product's triage line, where they stop being work and carry no deadline
          format: int64
          type: integer
        off_the_list_in_products:
          description: How many products that happens in
          format: int64
          type: integer
        open:
          description: Open findings of this issue you can see
          format: int64
          type: integer
        published:
          description: What was published when this was made, kept so a reader can see what we disagreed with
          type: string
        reasoning:
          description: Why. It outlives the version it was made about, so the next person needs the argument
          minLength: 1
          type: string
        severity:
          description: What we rate it
          enum:
            - low
            - medium
            - high
            - critical
          type: string
        state:
          enum:
            - proposed
            - live
            - withdrawn
          type: string
        vulnerability:
          description: The issue this is about
          type: string
      required:
        - severity
        - reasoning
      type: object
    Assign-findingRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Assign-findingRequest.json
          format: uri
          readOnly: true
          type: string
        person:
          description: Their sign-in identity, or empty for nobody
          type: string
      required:
        - person
      type: object
    AtComponentBody:
      additionalProperties: false
      properties:
        fixed_in:
          description: The version the report says fixes it, where it names one
          type: string
        places:
          description: How many places in this build it sits at
          format: int64
          type: integer
        severity:
          description: How bad the report rates it
          type: string
        vulnerability:
          type: string
      required:
        - vulnerability
        - places
      type: object
    BindingBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BindingBody.json
          format: uri
          readOnly: true
          type: string
        group:
          description: The group as the provider names it — a team slug, or a claim value
          maxLength: 191
          minLength: 1
          type: string
        product:
          description: The product the role is held against
          type: string
        role:
          description: What membership of this group grants
          enum:
            - reporting
            - approver
            - public-read
            - private-read
            - public-triage
            - private-triage
            - admin
          type: string
      required:
        - group
        - role
      type: object
    CanBody:
      additionalProperties: false
      properties:
        may_agree:
          description: Agree to somebody else's claim
          type: boolean
        may_hide:
          description: Argue about a finding nobody has disclosed
          type: boolean
        may_report:
          description: Read the reports
          type: boolean
        may_see:
          description: Read findings that have been disclosed
          type: boolean
        may_triage:
          description: Argue about a finding
          type: boolean
        name:
          description: What to show for it
          type: string
        product:
          type: string
        sees_all:
          description: Read findings nobody has disclosed yet
          type: boolean
      required:
        - product
        - name
        - may_see
        - sees_all
        - may_triage
        - may_hide
        - may_agree
        - may_report
      type: object
    CarriedBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CarriedBody.json
          format: uri
          readOnly: true
          type: string
        absent:
          description: Cover nothing in the new line
          format: int64
          type: integer
        applying:
          description: Reach it by matching. Nothing to choose
          format: int64
          type: integer
        moved:
          description: The version differs, so each needs a fresh answer
          items:
            $ref: "#/components/schemas/InheritedBody"
          type:
            - array
            - "null"
        postponed:
          description: Deferrals, offered separately and never carried by default
          items:
            $ref: "#/components/schemas/InheritedBody"
          type:
            - array
            - "null"
      required:
        - applying
        - moved
        - postponed
        - absent
      type: object
    ChangedBody:
      additionalProperties: false
      properties:
        arrived_from:
          description: The version this was bumped from since the earlier build. Only on still-present entries, where it means the bump did not reach the fix
          type: string
        because:
          description: Why it went. Only on fixed entries
          enum:
            - removed
            - upgraded
            - revised
            - superseded
            - unexplained
          type: string
        component:
          type: string
        severity:
          type: string
        vulnerability:
          type: string
      required:
        - vulnerability
        - component
      type: object
    ClaimApprovalBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ClaimApprovalBody.json
          format: uri
          readOnly: true
          type: string
        batch:
          description: Name a batch to agree to several claims under one name, so they can be undone together. At most 64 characters
          maxLength: 64
          type: string
        because:
          description: Why the rows in except are set aside, in markdown. Required when any are
          type: string
        except:
          description: Decisions in this claim to set aside rather than approve. They return to the proposer as a claim of their own, carrying the reason given in because
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
      type: object
    ClaimApprovedBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ClaimApprovedBody.json
          format: uri
          readOnly: true
          type: string
        approved:
          description: How many decisions were agreed to
          format: int64
          type: integer
        returned_claim:
          description: The claim the rows set aside went into, where any were
          format: int64
          type: integer
      required:
        - approved
      type: object
    ClaimBody:
      additionalProperties: false
      properties:
        derived_from:
          description: The claim this one came from, for an extension or a returned set
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        kind:
          description: "What sort of action it was: one judgment about a finding, one about many issues at a component, an approved claim carried to a new issue, or rows an approver set aside"
          enum:
            - finding
            - together
            - extension
            - returned
          type: string
        proposed_at:
          description: When the action was taken, as a date and time
          type: string
        proposed_by:
          type: string
        selected_by:
          description: How a bulk set was narrowed. Never part of the claim itself
          type: string
      required:
        - id
        - kind
        - proposed_by
        - proposed_at
      type: object
    Comment-on-decisionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Comment-on-decisionRequest.json
          format: uri
          readOnly: true
          type: string
        body:
          minLength: 1
          type: string
      required:
        - body
      type: object
    Comment-on-decisionResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Comment-on-decisionResponse.json
          format: uri
          readOnly: true
          type: string
        id:
          format: int64
          type: integer
      required:
        - id
      type: object
    CommentBody:
      additionalProperties: false
      properties:
        body:
          description: The comment text, in markdown
          type: string
        edited_at:
          description: When the author last changed it, if they did
          type: string
        id:
          format: int64
          type: integer
        written_at:
          type: string
        written_by:
          type: string
      required:
        - id
        - body
        - written_by
        - written_at
      type: object
    Compare-releasesResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Compare-releasesResponse.json
          format: uri
          readOnly: true
          type: string
        fixed:
          items:
            $ref: "#/components/schemas/ChangedBody"
          type:
            - array
            - "null"
        newly_present:
          items:
            $ref: "#/components/schemas/ChangedBody"
          type:
            - array
            - "null"
        still_present:
          items:
            $ref: "#/components/schemas/ChangedBody"
          type:
            - array
            - "null"
      required:
        - fixed
        - newly_present
        - still_present
      type: object
    ComponentFindingBody:
      additionalProperties: false
      properties:
        component:
          type: string
        ecosystem:
          description: The kind of package, as its identifier spells it. With the component and version it tells one row from another, which those two alone do not
          type: string
        exploited:
          description: Whether any of them is known-exploited
          type: boolean
        issues:
          description: Distinct vulnerabilities open against it, which is how many rows it contributes to the findings list
          format: int64
          type: integer
        places:
          description: How many times those sit somewhere in the build
          format: int64
          type: integer
        upstream:
          description: What a fork was cut from, where one is known
          type: string
        version:
          type: string
      required:
        - component
        - version
        - issues
        - places
        - exploited
      type: object
    ComponentFindingsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ComponentFindingsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/ComponentFindingBody"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    CoverageBody:
      additionalProperties: false
      properties:
        last_received_at:
          description: When a scan last arrived. Absent where none ever has
          type: string
        product:
          type: string
        quiet:
          description: Whether that is longer than this deployment allows
          type: boolean
        quiet_days:
          description: How long it has been, in days, measured from the last arrival or from when the build was declared
          format: int64
          type: integer
        retired:
          description: Whether this build's release is out of support, in which case silence is expected and it is never reported as quiet
          type: boolean
        stream:
          type: string
        stream_kind:
          description: Whether this line moves
          enum:
            - branch
            - tag
          type: string
        variant:
          type: string
      required:
        - product
        - stream
        - stream_kind
        - variant
        - quiet_days
      type: object
    CoverageOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CoverageOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/CoverageBody"
          type:
            - array
            - "null"
        quiet:
          description: How many have gone quiet, across every build and not only this page
          format: int64
          type: integer
        quiet_after_days:
          description: How long this deployment allows, in days
          format: int64
          type: integer
        total:
          description: How many builds there are to report on
          format: int64
          type: integer
      required:
        - items
        - quiet
        - total
        - quiet_after_days
      type: object
    Decide-togetherRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Decide-togetherRequest.json
          format: uri
          readOnly: true
          type: string
        deferred_until:
          description: Required when it is deferred. A date, as 2026-03-31
          type: string
        justification:
          description: Required when it does not apply
          type: string
        outcome:
          enum:
            - affected
            - not-applicable
            - deferred
            - wont-fix
          type: string
        reasoning:
          description: Why this holds for every issue named
          minLength: 1
          type: string
        selected_by:
          description: How you narrowed this set. Recorded, and never part of the claim
          maxLength: 500
          minLength: 1
          type: string
        vulnerabilities:
          description: The issues this claim covers, by name
          items:
            type: string
          maxItems: 2000
          minItems: 1
          type:
            - array
            - "null"
      required:
        - vulnerabilities
        - selected_by
        - outcome
        - reasoning
      type: object
    Decide-togetherResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Decide-togetherResponse.json
          format: uri
          readOnly: true
          type: string
        claim_id:
          description: The claim this action made, which is what the review queue lists and what is approved
          format: int64
          type: integer
        ids:
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        recorded:
          format: int64
          type: integer
      required:
        - claim_id
        - recorded
        - ids
      type: object
    DecidedBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DecidedBody.json
          format: uri
          readOnly: true
          type: string
        claim_id:
          description: The claim this action made, which is what the review queue lists and what is approved
          format: int64
          type: integer
        covered:
          description: How many findings those places hold
          format: int64
          type: integer
        ids:
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        left:
          description: Places of this finding left open, because they were not named
          format: int64
          type: integer
        needs_approval:
          description: Whether a second person has to agree
          type: boolean
        recorded:
          description: How many places it was written against
          format: int64
          type: integer
      required:
        - claim_id
        - recorded
        - covered
        - left
        - needs_approval
        - ids
      type: object
    DecisionBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DecisionBody.json
          format: uri
          readOnly: true
          type: string
        claim_id:
          description: "The claim this decision is one row of: the action that wrote it, which is what the review queue lists and what is approved"
          format: int64
          type: integer
        deferred_until:
          description: When a deferral returns, as a date. Required for a deferral
          type: string
        id:
          description: What to name this decision in a later request
          format: int64
          type: integer
        justification:
          description: Why it does not apply. Required when it does not
          enum:
            - component_not_present
            - vulnerable_code_not_present
            - vulnerable_code_not_in_execute_path
            - vulnerable_code_cannot_be_controlled_by_adversary
            - inline_mitigations_already_exist
          type: string
        mitigation:
          description: What actually stops it — the rule, the setting, the service that is not exposed. Required when the reason is that mitigations already exist, and refused with any other
          type: string
        needs_approval:
          description: Whether a second person has to agree before it takes effect
          type: boolean
        outcome:
          description: What was decided
          enum:
            - affected
            - not-applicable
            - deferred
            - wont-fix
          type: string
        places:
          description: How many findings this decision covers
          format: int64
          type: integer
        reasoning:
          description: Why, in markdown. Somebody else has to agree with this
          minLength: 1
          type: string
        selected_by:
          description: How the set was narrowed, for a claim recorded as one of many. Never part of the claim itself
          type: string
        sent_back_at:
          description: When an approver last asked for more. Empty means nobody has
          type: string
        state:
          description: Where it has got to
          enum:
            - proposed
            - approved
            - withdrawn
            - lapsed
          type: string
        versions:
          description: How many versions of the component sit here. More than one needs care
          format: int64
          type: integer
      required:
        - outcome
        - reasoning
      type: object
    DecisionDetail:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DecisionDetail.json
          format: uri
          readOnly: true
          type: string
        age_days:
          description: How long the claim has stood. An old judgment should look like one
          format: int64
          type: integer
        decision:
          $ref: "#/components/schemas/DecisionBody"
        finding:
          $ref: "#/components/schemas/FindingRefBody"
          description: What the decision is about — build, issue, component, where it sits — read from the open finding at its place. Absent where none is open there
        place:
          $ref: "#/components/schemas/PlaceBody"
        proposed_at:
          description: When the claim was made, as a date and time
          type: string
        proposed_by:
          type: string
        reasoning:
          description: The justification as it currently stands, in markdown
          type: string
      required:
        - decision
        - place
        - reasoning
        - proposed_by
        - proposed_at
        - age_days
      type: object
    DecisionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DecisionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/DecisionDetail"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    DeclaredKeyBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredKeyBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/KeyBody"
      required:
        - created
        - item
      type: object
    DeclaredPersonBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredPersonBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/PersonBody"
      required:
        - created
        - item
      type: object
    DeclaredProductBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredProductBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/ProductBody"
      required:
        - created
        - item
      type: object
    DeclaredStreamBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredStreamBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/StreamBody"
      required:
        - created
        - item
      type: object
    DeclaredVariantBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredVariantBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/VariantBody"
      required:
        - created
        - item
      type: object
    EarlierBody:
      additionalProperties: false
      properties:
        about:
          description: The component upstream version it was a claim about
          type: string
        approved_by:
          description: Who last agreed to it, where anybody did
          type: string
        claim_id:
          format: int64
          type: integer
        decision_id:
          format: int64
          type: integer
        deferred_until:
          type: string
        ended:
          description: Why it stopped applying
          enum:
            - lapsed
            - withdrawn
          type: string
        ended_at:
          type: string
        justification:
          type: string
        outcome:
          type: string
        proposed_at:
          type: string
        proposed_by:
          type: string
        reasoning:
          description: The reasoning as it last stood, in markdown, offered back rather than thrown away
          type: string
      required:
        - decision_id
        - claim_id
        - outcome
        - proposed_by
        - proposed_at
        - ended
        - reasoning
      type: object
    Edit-commentRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Edit-commentRequest.json
          format: uri
          readOnly: true
          type: string
        body:
          minLength: 1
          type: string
      required:
        - body
      type: object
    EndOfLifeBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EndOfLifeBody.json
          format: uri
          readOnly: true
          type: string
        "on":
          description: The date support ends, as YYYY-MM-DD, or empty to clear it
          pattern: ^(\d{4}-\d{2}-\d{2})?$
          type: string
      required:
        - "on"
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:

    WaitingBody:
      additionalProperties: false
      properties:
        age_days:
          description: How long the claim has stood. An old judgment should look like one
          format: int64
          type: integer
        builds:
          description: Every build the claim currently covers, as stream and variant
          items:
            type: string
          type:
            - array
            - "null"
        claim:
          $ref: "#/components/schemas/ClaimBody"
        decision:
          $ref: "#/components/schemas/DecisionBody"
        decisions:
          description: How many rows the claim wrote
          format: int64
          type: integer
        deferred_days:
          description: How long this finding has been put off in total
          format: int64
          type: integer
        finding:
          $ref: "#/components/schemas/FindingRefBody"
          description: What the representative decision is about — build, issue, component, where it sits — so the card can be judged without opening it. Absent where no open finding sits at its place
        issues:
          description: How many distinct issues it covers
          format: int64
          type: integer
        outliers:
          $ref: "#/components/schemas/OutliersBody"
          description: "For a claim over many issues: the rows that do not look like the rest, and how many there are"
        place:
          $ref: "#/components/schemas/PlaceBody"
        places:
          description: How many distinct places it covers
          format: int64
          type: integer
        previously_approved:
          description: This was agreed to before and came back
          type: boolean
        proposed_by:
          type: string
        reasoning:
          type: string
      required:
        - claim
        - decision
        - place
        - reasoning
        - proposed_by
        - age_days
        - decisions
        - issues
        - places
        - builds
      type: object
    WhoBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/WhoBody.json
          format: uri
          readOnly: true
          type: string
        admin:
          description: Administers this deployment
          type: boolean
        identity:
          description: What this deployment calls them
          type: string
        kind:
          description: A person who signed in, or a credential
          enum:
            - person
            - key
          type: string
        name:
          description: What to show instead of the identity, where one is recorded
          type: string
        reach:
          description: The products they can reach, and what they may do in each
          items:
            $ref: "#/components/schemas/CanBody"
          type:
            - array
            - "null"
      required:
        - identity
        - name
        - admin
        - kind
        - reach
      type: object
    Withdraw-roleResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Withdraw-roleResponse.json
          format: uri
          readOnly: true
          type: string
        released:
          description: Findings handed back because that was their last role here
          format: int64
          type: integer
      required:
        - released
      type: object
info:
  description: Track vulnerabilities in the products you ship.
  title: OpenPSIRT
  version: dev
openapi: 3.1.0
paths:
  /v1/approval-batches/{batch}:
    delete:
      description: |-
        Withdraws every approval recorded under this batch name, returning those decisions to the review queue. The decisions themselves stand — only the approvals are undone. Returns how many were affected.

        Only decisions on products you may triage are touched.
      operationId: undo-batch
      parameters:
        - in: path
          name: batch
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Undo-batchResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Undo a bulk approval
      tags:
        - Triage
  /v1/assessments:
    get:
      description: Every claim, or those in one state. The ones waiting are milder ratings somebody has proposed and nobody has agreed to yet, which are the ones not yet affecting anything.
      operationId: list-assessments
      parameters:
        - description: Limit to one state
          explode: false
          in: query
          name: state
          schema:
            description: Limit to one state
            enum:
              - proposed
              - live
              - withdrawn
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyAssessmentBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List what we have said about issues
      tags:
        - Triage
  /v1/assessments/{id}:
    delete:
      description: The rating in force returns to the published one, and everything that reads it — where a finding sits in the list, how long it has, whether it is above the line a product triages — follows it back.
      operationId: withdraw-assessment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw an assessment, and take the published rating back
      tags:
        - Triage
  /v1/assessments/{id}/agreement:
    post:
      description: "Only a milder rating waits for this. Somebody other than whoever proposed it, for the same reason every other second person here is somebody else: a control one person can complete alone is not a control."
      operationId: agree-assessment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Agree to a milder rating so it takes effect
      tags:
        - Triage
  /v1/assignments:
    get:
      description: |-
        Returns everyone holding open findings you can see, with how many.

        The number worth watching is not how many findings exist but how many are waiting behind somebody: an idle account holding nothing is harmless, and work stuck behind a person who has gone is the problem — nothing tells this software that somebody has left.
      operationId: list-holdings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyHoldingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List how much each person is dealing with
      tags:
        - Findings
  /v1/claims/{id}/approval:
    post:
      description: |-
        Approves every waiting decision in a claim as one action, under the same rules each decision is approved under: not by the person who proposed it, and against the revision of the reasoning that stands now.

        Name decisions in `except` to set them aside. The rest is approved; those are moved into a claim of their own, marked sent back, and `because` is recorded on each as a comment — the same way sending back records a reason. The response names that claim.

        Pass `batch` to approve several claims under one name, undone together with `DELETE /v1/approval-batches/{batch}`.

        Returns 404 for a claim you may not act on every row of, and 409 if you proposed it.
      operationId: approve-claim
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimApprovalBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimApprovedBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve a claim
      tags:
        - Triage
  /v1/claims/{id}/send-back:
    post:
      description: |-
        Asks the author for more before agreeing to any of a claim. Every waiting decision in it leaves the review queue together and comes back when the author revises.

        `because` is required and is recorded as a comment on each decision. Needs no approval of its own. You cannot send back a claim whose words are your own.
      operationId: send-claim-back
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Send-claim-backRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Send a claim back for more
      tags:
        - Triage
  /v1/comments/{id}:
    put:
      description: |-
        Replaces the text of a comment. Only its author may do this, and the new text overwrites the old rather than being kept as a revision — a comment is a remark, not a justification.

        The text is markdown and is validated before it is stored; a 422 names the line and the offending text.
      operationId: edit-comment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Edit-commentRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Edit a comment
      tags:
        - Triage
  /v1/decisions:
    get:
      description: |-
        Returns triage decisions on products you may triage, newest first, with the justification text for each.

        Filter by `outcome` to list dismissals (`not-applicable`, `wont-fix`) or postponements (`deferred`), by `state` to separate what is approved from what is still waiting or has been withdrawn, and by `product` to limit to one product.

        Set `expired=true` to list deferrals whose date has passed — the findings that have come back and need judging again.
      operationId: list-decisions
      parameters:
        - description: Limit to one product, by name
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name
            type: string
        - description: Limit to one outcome
          explode: false
          in: query
          name: outcome
          schema:
            description: Limit to one outcome
            enum:
              - affected
              - not-applicable
              - deferred
              - wont-fix
            type: string
        - description: Limit to one state
          explode: false
          in: query
          name: state
          schema:
            description: Limit to one state
            enum:
              - proposed
              - approved
              - withdrawn
              - lapsed
            type: string
        - description: Only deferrals whose date has passed
          explode: false
          in: query
          name: expired
          schema:
            description: Only deferrals whose date has passed
            type: boolean
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List triage decisions
      tags:
        - Triage
  /v1/decisions/{id}:
    delete:
      description: Withdraws the decision so it no longer applies to any finding. The record is kept — a withdrawn decision reads as proposed, approved, then withdrawn. Requires no approval.
      operationId: withdraw-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw a triage decision
      tags:
        - Triage
    get:
      description: |-
        Returns one decision with the justification as it currently stands, where it applies, who proposed it and how long it has stood.

        For the earlier justifications see `GET /v1/decisions/{id}/revisions`, and for who agreed to which of them see `GET /v1/decisions/{id}/approvals`.
      operationId: get-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionDetail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a triage decision
      tags:
        - Triage
  /v1/decisions/{id}/approval:
    post:
      description: |-
        Approves a proposed decision. Returns 409 if you proposed it yourself — the proposer and approver must always be different people, and there is no override.

        An approval is recorded against the specific revision of the justification that exists now. Editing the justification afterwards withdraws the approval and returns the decision to this queue.

        Pass `batch` to approve many decisions under one name, so they can be undone together with `DELETE /v1/approval-batches/{batch}`.
      operationId: approve-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Approve-decisionRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve a triage decision
      tags:
        - Triage
  /v1/decisions/{id}/approvals:
    get:
      description: |-
        Returns every approval recorded against this decision, including ones later withdrawn, each naming the revision of the justification it was given for.

        A withdrawn approval is kept rather than deleted: who agreed to what, and when it stopped counting, is part of the record.

        `covered` is how many findings the claim covered **when it was agreed to**. A decision applies to every build running the same versions, so it covers more as builds appear — with nobody acting, and nobody having agreed to the larger number. Comparing this against what it covers now is the point of keeping it.
      operationId: list-decision-approvals
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyApprovalBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List who approved a decision
      tags:
        - Triage
  /v1/decisions/{id}/comments:
    get:
      description: |-
        Returns the comments on a decision, oldest first, with who wrote each and when. A comment that has been edited also carries when it was last changed.

        Comments are separate from the justification and never affect an approval.
      operationId: list-decision-comments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyCommentBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List comments on a decision
      tags:
        - Triage
    post:
      description: |-
        Adds a markdown comment to a decision. Comments are separate from the justification and never affect an approval, so an approved decision can be annotated at any time.

        A comment may later be edited by its author only, and editing overwrites it rather than keeping revisions.
      operationId: comment-on-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Comment-on-decisionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment-on-decisionResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a comment to a decision
      tags:
        - Triage
  /v1/decisions/{id}/reasoning:
    put:
      description: |-
        Replaces the justification text with a new revision. Earlier revisions are kept and remain readable.

        **This withdraws any existing approval** and returns the decision to the review queue, marked as previously approved. Requires no approval of its own.

        The text is markdown and is validated before it is stored; a 422 names the line and the offending text.
      operationId: revise-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Revise-decisionRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a decision's justification
      tags:
        - Triage
  /v1/decisions/{id}/revisions:
    get:
      description: |-
        Returns every revision of the justification, oldest first, with who wrote each and when.

        An approval names the specific revision that was agreed to, so this is how to read what an approver actually saw rather than what the text says now.
      operationId: list-decision-revisions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyRevisionBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a decision's justification history
      tags:
        - Triage
  /v1/decisions/{id}/send-back:
    post:
      description: |-
        Asks the author for more before agreeing. The claim leaves the review queue and comes back when they revise it.

        `because` is required and is recorded as a comment, because that is what it is — the author needs the words, and a reason kept anywhere else is one nobody reads. Sending something back without saying what is missing is a round trip nobody learns from.

        Needs no approval of its own: it puts risk back on the table rather than taking it off. You cannot send back a claim whose current words are your own — that is yours to revise.
      operationId: send-decision-back
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Send-decision-backRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Send a decision back for more
      tags:
        - Triage
  /v1/issues/{vulnerability}/assessment:
    post:
      description: |-
        Recorded against the **issue**, not against a place. A published rating being wrong, or a report being disputed, is one statement about the vulnerability — true wherever it appears, including in products it has not reached yet, and it does not stop being true because somebody rebuilt something.

        It changes the order, which is what makes it worth having rather than a note nobody acts on. Rating something **worse** than published takes effect at once: nobody needs protecting from being told something is worse than the world says. Rating it **milder** waits for a second person, because that is the direction that hides things — and it hides more than a position in a list. Severity sets the deadline, so calling a high a low pushes its deadline out by months, and where a product has said what is worth triaging at all, a downgrade below that line takes the finding off the working list and off any clock entirely.

        The published rating is never overwritten. Ours is what ranks; the world's stays beside it, because a rating of ours shown where the world's goes reads as the world's.
      operationId: assess-issue
      parameters:
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record what we think of an issue, as against what was published
      tags:
        - Triage
  /v1/keys:
    get:
      description: "Which credentials exist, what each may send, when it was last used and whether it still works. The secrets are not here and cannot be: what is stored is a digest."
      operationId: list-keys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyKeyBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List API keys
      tags:
        - Administration
    post:
      description: "Creates a credential a build may send scans with, and returns its secret. The secret is shown once and stored hashed: a credential store that can hand back what it holds gives up every pipeline's key with a copy of the database."
      operationId: create-key
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredKeyBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an API key
      tags:
        - Administration
  /v1/keys/{name}:
    delete:
      description: Stops it working, without removing the record of what it sent. Revoking one credential leaves every other pipeline running.
      operationId: revoke-key
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke an API key
      tags:
        - Administration
  /v1/notifications:
    delete:
      description: Takes everything off your list at once, and says how many that was. Conditions that are still true will not come back while they hold.
      operationId: acknowledge-all-notifications
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Acknowledge-all-notificationsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Acknowledge everything waiting on you
      tags:
        - Notifications
    get:
      description: |-
        Returns what you have not dealt with, newest first, and how many there are.

        Everyone has one of these, and what appears in it differs by what you hold: work arriving, a dismissal sent back, an approval an edit withdrew, or — for an administrator — that the tool itself is unwell.

        Two lifetimes, and the difference matters to a caller. An **event** happened once and goes away when you acknowledge it. A **condition** is true while something is true and clears itself when that stops, so a build that resumes being scanned leaves this list without anybody dismissing it.
      operationId: list-notifications
      parameters:
        - description: How many to return
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: How many to return
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: How many to skip
          explode: false
          in: query
          name: offset
          schema:
            description: How many to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List what is waiting on you
      tags:
        - Notifications
  /v1/notifications/{id}:
    delete:
      description: |-
        Takes one off your list.

        Yours only. A notification identifier is a number a caller supplies, and one belonging to somebody else answers the same way as one that does not exist.

        Acknowledging a condition hides it rather than resolving it: what it is about is still true, and the pass that derives it will not raise it again while it holds.
      operationId: acknowledge-notification
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Acknowledge one notification
      tags:
        - Notifications
  /v1/people:
    get:
      description: |-
        Lists everybody who may sign in, with the roles each of them holds and the products those apply to.

        Nobody appears here by having authenticated. Access is granted in advance, so this list is what an administrator has decided rather than who has turned up.
      operationId: list-people
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyPersonBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List users
      tags:
        - Administration
    post:
      description: Records somebody so that they may sign in, and optionally what they hold. Recording the same person again confirms them and adds any roles named.
      operationId: record-person
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredPersonBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a user and grant roles
      tags:
        - Administration
  /v1/people/tokens:
    get:
      description: |-
        Lists every personal token in the deployment, whose it is, what it may send and when it was last used.

        Without it a stale token is found only when somebody leaves and nobody knows what breaks if it is turned off.
      operationId: list-all-tokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyTokenBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List all users' API tokens
      tags:
        - Administration
  /v1/people/{identity}/assignments:
    get:
      description: |-
        The open findings assigned to somebody, most urgent first, in the same units as what nobody is dealing with: **one item per issue in a component in a product**, not one per build. The same code built several ways is one piece of work, and it was taken on as one.

        Send `me` as the identity for your own.
      operationId: list-assigned
      parameters:
        - description: Their sign-in identity, or 'me' for your own
          in: path
          name: identity
          required: true
          schema:
            description: Their sign-in identity, or 'me' for your own
            type: string
        - description: Limit to one product, by name. Empty means every product you can see
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name. Empty means every product you can see
            type: string
        - description: Limit to one branch or tag. Only meaningful with a product
          explode: false
          in: query
          name: stream
          schema:
            description: Limit to one branch or tag. Only meaningful with a product
            type: string
        - description: Limit to one variant. Only meaningful with a product, and independent of the branch
          explode: false
          in: query
          name: variant
          schema:
            description: Limit to one variant. Only meaningful with a product, and independent of the branch
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-assignedResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List what one person is dealing with
      tags:
        - Findings
  /v1/people/{identity}/assignments/release:
    post:
      description: |-
        Returns all their open findings to the unassigned list. For when somebody has left, or their last role is removed.

        Nothing tells this software that somebody has gone — membership is read at sign-in, and a person who has left never signs in again. So this is an action an administrator takes rather than something that happens on its own, and until it is taken their work is in no list at all: not in the shared one because it is assigned, and not in anybody's own because they are not here.

        Send `to` instead to hand it to a named person rather than to nobody.
      operationId: release-assignments
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Release-assignmentsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release-assignmentsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Hand back everything one person is dealing with
      tags:
        - Administration
  /v1/people/{identity}/roles/{product}/{role}:
    delete:
      description: |-
        Withdraws one role from one person. Takes effect at their next request; end their sessions to cut them off now.

        If it was their last role on that product, everything they were dealing with there goes back to the unassigned list. Otherwise that work is in no list at all: not in the shared one because it is assigned, and not in theirs because they can no longer open it. `released` says how much moved.

        The grant is removed rather than marked as ended. What somebody used to hold is answered by the record of what they did, so this list only ever says what is true today.
      operationId: withdraw-role
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: role
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdraw-roleResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke a user's role on a product
      tags:
        - Administration
  /v1/people/{identity}/sessions:
    delete:
      description: Takes effect at once, whichever copy of the application answers next. Roles and group mappings are re-read at sign-in, so withdrawing one takes effect then; this is what makes somebody leaving immediate instead.
      operationId: end-sessions
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: End all of a user's sessions
      tags:
        - Administration
  /v1/people/{identity}/tokens/{name}:
    delete:
      description: |-
        Revokes one person's token on their behalf. It stops working immediately; the record of what it sent stays.

        An owner withdraws their own through their own token paths. This is for the ones whose owner is no longer here to do it.
      operationId: revoke-anyones-token
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke another user's API token
      tags:
        - Administration
  /v1/products:
    get:
      description: |-
        Lists the products declared here, with what each one holds.

        A scan may only be filed against something declared, so this is the first question to ask after an upload is refused for naming something unknown.
      operationId: list-products
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyProductBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List products
      tags:
        - Catalog
    post:
      description: Records a product so scans may be filed against it. Declaring one that already exists succeeds without changing anything, so this can run on every build.
      operationId: declare-product
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredProductBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a product
      tags:
        - Catalog
  /v1/products/{product}/comparison:
    get:
      description: |-
        Returns what was fixed, what is newly present, and what is still there between two builds of one product.

        Between **any** two, not only adjacent ones: what a release note has to answer is usually about the last release a customer has, which is rarely the previous one.

        Each fixed entry says why it went, because "fixed by upgrading" and "fixed by a carried patch" are different sentences to a reader. `superseded` is the one to read carefully — it means the version moved and the issue came with it, so it was not fixed at all.

        A still-present entry carrying `arrived_from` is the same failure seen from the other side: somebody moved that version since the earlier build and the issue came with it, so the bump did not reach the fix.

        **Public findings only unless you ask otherwise.** Its destination is usually a public document, so including something undisclosed should be deliberate rather than something pasted in without noticing.
      operationId: compare-releases
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: The earlier build's stream — a branch or a tag
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: The earlier build's stream — a branch or a tag
            type: string
        - description: The earlier build's variant
          explode: false
          in: query
          name: from_variant
          required: true
          schema:
            description: The earlier build's variant
            type: string
        - description: The later build's stream
          explode: false
          in: query
          name: to
          required: true
          schema:
            description: The later build's stream
            type: string
        - description: The later build's variant
          explode: false
          in: query
          name: to_variant
          required: true
          schema:
            description: The later build's variant
            type: string
        - description: Include findings nobody has disclosed
          explode: false
          in: query
          name: include_undisclosed
          schema:
            description: Include findings nobody has disclosed
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compare-releasesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Compare two builds
      tags:
        - Findings
  /v1/products/{product}/end-of-life:
    put:
      description: |-
        Sets the date support ends for every release of a product that has not stated its own. Past it, nothing on the product carries a remediation deadline and a build that stops being scanned is expected rather than a fault.

        Nothing is deleted or hidden: the findings and the history stay, and stay reportable. What ends is what is expected of us.

        An empty date clears it, because extended support happens. Deadlines are rewritten afterwards, away from the request; the response returns before that has finished.
      operationId: set-product-end-of-life
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndOfLifeBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set when a product goes out of support
      tags:
        - Catalog
  /v1/products/{product}/mentionable:
    get:
      description: |-
        Returns the people who can already read findings of this visibility in this product, so an editor can offer them.

        Only people who can already see the thing. An autocomplete listing everybody teaches somebody to name a colleague who then cannot open what they were called to — and on an undisclosed finding, the mention itself says a finding exists, which is the disclosure the visibility rule prevents.

        `visibility` says which kind of finding the text is about. Asking about undisclosed findings requires being able to read them.
      operationId: list-mentionable
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: Which kind of finding the text is about
          explode: false
          in: query
          name: visibility
          schema:
            default: public
            description: Which kind of finding the text is about
            enum:
              - public
              - private
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 25
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyMentionableBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List who may be mentioned here
      tags:
        - Triage
  /v1/products/{product}/releases:
    get:
      description: |-
        One number per build, which is what a release-over-release chart is drawn from. The comparison endpoint says what changed between **two** builds; this says whether the estate is getting better or worse across all of them.

        Counted before any triage line is applied, so it agrees with the findings list rather than with whatever a product has decided is worth working on — a line is about what to spend an afternoon on, not about what exists.

        Severities are folded the same four ways everything else here ranks by, through the one expression the working list and the deadline also read, so a chart cannot disagree with a list about what counts as high.
      operationId: list-releases
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyReleaseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: How much is open against each build of a product
      tags:
        - Findings
  /v1/products/{product}/streams:
    get:
      operationId: list-streams
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyStreamBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a product's branches and tags
      tags:
        - Catalog
    post:
      description: Records a line of a product. A branch moves and is rebuilt; a tag never changes and is what somebody received.
      operationId: declare-stream
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredStreamBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a branch or tag
      tags:
        - Catalog
  /v1/products/{product}/streams/{stream}/end-of-life:
    put:
      description: |-
        Sets the date support ends for one release, overriding what its product says. Past it, nothing on the release carries a remediation deadline and a build that stops being scanned is expected rather than a fault.

        An empty date clears the override, so the release follows its product again. Clearing is not the same as stating the product's current date: a release that stated it would stop following when the product changed.
      operationId: set-stream-end-of-life
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndOfLifeBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set when a branch or tag goes out of support
      tags:
        - Catalog
  /v1/products/{product}/streams/{stream}/variants:
    get:
      description: |-
        Lists the variants one release was actually built as — a subset of what the product declares.

        A release predating a variant has never been filed against it and does not list it, which is what keeps something introduced later from appearing to have shipped years ago.
      operationId: list-release-variants
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyVariantBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the variants a release was built as
      tags:
        - Catalog
  /v1/products/{product}/streams/{stream}/variants/{variant}/carried:
    get:
      description: |-
        Returns what an existing line's decisions would mean for this one, without changing anything. Ask before creating a line, because the answer is what somebody is agreeing to — a carry that happens silently is one nobody reviews.

        Four groups, because they need four different things:

        `applying` reach this line by matching. Nothing to choose; a decision is a claim about a combination of code rather than about a release.

        `moved` held a claim at a version this line does not have. Each would come across as a **proposal carrying the old reasoning** — never as a decision, because the version moved and the old conclusion is not a conclusion about the new code. Making somebody start from a blank page, having thrown away what was written last time, is how a tool teaches people to stop writing reasoning at all.

        `postponed` were deferrals. "Not this sprint" was about that sprint, so carrying one silently gives a new line expiry dates nobody chose. Each says how long it has already been put off across every line it has come through, because that total is what carrying it again agrees to.

        `absent` cover nothing here and are left behind.
      operationId: preview-carried-decisions
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The stream to inherit from
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: The stream to inherit from
            type: string
        - description: That stream's variant
          explode: false
          in: query
          name: from_variant
          required: true
          schema:
            description: That stream's variant
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarriedBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show what triage a new line would inherit
      tags:
        - Triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/components:
    get:
      description: |-
        Returns the build's own component and what it depends on, most findings first. The root is named separately from the list because it is what the list hangs from rather than a member of it.

        The starting point for walking the graph. A full render is not offered and would not be useful: a real image holds thousands of components and tens of thousands of edges, which neither draws nor reads. Ask for one step at a time.

        Every entry carries how many findings are open against it and how many components it pulls in, so descending follows something rather than being exploration.

        With `q` it searches instead: components anywhere in the build whose name contains that text, most findings first and no root. Nobody finds anything in a graph this size by opening nodes — a real image holds eight thousand components under a root with five thousand children — so searching is the way in, and browsing is for answering "what else is under this" once you are already somewhere.
      operationId: list-top-level-components
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: Find components anywhere in this build whose name contains this, instead of listing what the build pulls in directly
          explode: false
          in: query
          name: q
          schema:
            description: Find components anywhere in this build whose name contains this, instead of listing what the build pulls in directly
            type: string
        - description: How many matches to return. Only read when searching
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: How many matches to return. Only read when searching
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List what a build pulls in directly
      tags:
        - Findings
  /v1/products/{product}/streams/{stream}/variants/{variant}/components/{component}/around:
    get:
      description: |-
        Returns what pulls this component in, and what it pulls in.

        `above` is the direction people actually use. Somebody arrives from a finding and asks why the component is here, which is walking up — and up is short. Walking down is where the size lives.

        A component reached several ways appears once with several parents. It is a graph rather than a tree, so anything drawing it has to expect the same component under many places.

        **A component name is not unique within a build.** Where one ships at several versions, `version` says which — without it, a name that matches more than one is refused with 409, naming the choices, rather than guessed at.
      operationId: get-component-neighbours
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The component's name, as the findings list gives it
          in: path
          name: component
          required: true
          schema:
            description: The component's name, as the findings list gives it
            type: string
        - description: Which version, where the build ships that name at more than one
          explode: false
          in: query
          name: version
          schema:
            description: Which version, where the build ships that name at more than one
            type: string
        - description: Which ecosystem, for the few names one build holds at one version as two components
          explode: false
          in: query
          name: ecosystem
          schema:
            description: Which ecosystem, for the few names one build holds at one version as two components
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AroundBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show what is directly above and below a component
      tags:
        - Findings
  /v1/products/{product}/streams/{stream}/variants/{variant}/components/{component}/decisions:
    post:
      description: |-
        Records the same claim against every issue you name: one outcome, one justification, one reasoning, and a separate decision for every place each issue sits at, each keyed and expiring on its own.

        You name the issues; the places are resolved here. `selected_by` says how you narrowed the list and is recorded with every claim, so "how were these chosen" has an answer later — but it is never the claim. The reasoning has to hold for every issue in the list, since "these matched a word" is not a defence anybody would accept.

        Always needs a second person to agree, whatever the outcome.

        Bounded. At most 2000 names per request, and a limit on how many findings one action may write, set under `triage.together-cap`. The limit is checked against the findings this resolves to, which is more than the number of names.
      operationId: decide-together
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: component
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decide-togetherRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decide-togetherResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record one judgment about several issues at once
      tags:

          description: Who is dealing with this, by sign-in identity. Empty means nobody, or not everywhere the same person
          type: string
        component:
          type: string
        description:
          type: string
        exploited:
          description: Somebody is known to be exploiting this
          type: boolean
        fix_state:
          enum:

  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/components/{component}:
    get:
      description: |-
        Returns the full record for one issue in one component of a build: the description, the advisory, every reference the data carries with patches listed first, the score and what it assumes, whether it is known to be exploited and how likely exploitation is, the weakness classification, what upstream has done about it, and every place the component sits at here.

        This is what a triage decision is made from, so it is gathered into one request. Each entry in `places` carries the `place` identity to name when recording a decision about it.

        **A component name is not unique within a build.** Where one ships at several versions, `version` says which — without it, a name that matches more than one is refused rather than guessed at.
      operationId: get-finding
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
        - description: The component's name, as the findings list gives it
          in: path
          name: component
          required: true
          schema:
            description: The component's name, as the findings list gives it
            type: string
        - description: Which version, where the build ships that name at more than one
          explode: false
          in: query
          name: version
          schema:
            description: Which version, where the build ships that name at more than one
            type: string
        - description: Which ecosystem, for the few names one build holds at one version as two components — a source repository and the package built from it
          explode: false
          in: query
          name: ecosystem
          schema:
            description: Which ecosystem, for the few names one build holds at one version as two components — a source repository and the package built from it
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get everything known about one finding
      tags:
        - Findings
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/components/{component}/assignment:
    put:
      description: |-
        Records who is dealing with this issue in this component.

        **It covers the product, not the build named in the path.** The path says which finding is being looked at; what is assigned is the work it belongs to. The same code built as several variants is one piece of work — a judgment about it carries no variant — so this covers every build of the product holding the same component. Assigning one build would leave the identical work unassigned beside it, and the person would hold half of what they think they hold.

        It also covers every place the component sits at, because those are the same problem seen from several parents.

        Send `person` as an empty string to hand it back to nobody. Handing back is the same operation as giving out, so there is one path rather than two that drift.

        Findings arriving later under the same component start unassigned.
      operationId: assign-finding
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - in: path
          name: component
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Assign-findingRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Assign a finding to somebody
      tags:
        - Findings
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/components/{component}/decision:
    post:
      description: |-
        Records the same claim against every place this issue occupies in this component. Naming `places` narrows it; leaving it out covers all of them, which is the default a judgment should have — a kernel flaw reaches sixty modules and the answer is almost always the same for all of them, so asking sixty times guarantees somebody stops reading.

        A place left out stays **open**. Nothing is recorded against it and nothing is asked about it: a component used unsafely in one consumer and not another is exactly what per-place findings exist to capture, and demanding a justification for the places you did not answer is the tool arguing with a judgment it asked for.

        One action still writes one record per place, each keyed and expiring on its own (REL-02), so a place that later diverges is not silently covered by a decision nobody made about it.

        The ordinary approval rules apply however many places this reaches. Always needing a second person is about a claim covering **several issues** nobody read one by one; this is one claim about one issue (TRI-38).

        Pass `extends` to carry an approved claim to this issue: the source must be approved, sit at the same component under the same consumer, and the outcome and justification must match it. The new claim is recorded as an extension of it and still waits for a second person. `similar` on `GET .../findings/{vulnerability}/components/{component}` lists the claims that qualify.
      operationId: decide-finding
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
        - description: The component, as the findings list gives it
          in: path
          name: component
          required: true
          schema:
            description: The component, as the findings list gives it
            type: string
        - description: Which version, where the build ships more than one under that name
          explode: false
          in: query
          name: version
          schema:
            description: Which version, where the build ships more than one under that name
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingDecisionBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecidedBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record one judgment about a finding, covering its places
      tags:
        - Triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/places/{place}/decision:
    get:
      description: |-
        Returns the decision currently suppressing this finding, if any, together with everything decided here before — withdrawn claims, and claims that stopped applying when an upstream version changed.

        `standing` is absent when nothing has been decided, or when a claim is still waiting for approval: a claim nobody has agreed to suppresses nothing.

        Read `previously` before deciding again. A claim that lapsed on a version bump is usually still the right answer, and re-affirming it is a different request from making a new one.
      operationId: get-finding-decision
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
        - description: Which place, as the findings list gives it
          in: path
          name: place
          required: true
          schema:
            description: Which place, as the findings list gives it
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get what has been decided about a finding
      tags:
        - Triage
    post:
      description: |-
        Records how a finding was triaged: `affected`, `not-applicable`, `deferred` or `wont-fix`.

        `not-applicable` requires a `justification` from the standard VEX vocabulary. `deferred` requires `deferred_until` as a date.

        The decision applies to every build running the same component and consumer upstream versions, including future releases — it is matched by code, not copied between releases. It stops applying automatically when either upstream version changes.

        The response says whether a second person must approve it. Most outcomes require approval; a deferral shorter than the configured threshold does not.

        It also says how many findings this one judgment covers, and how many distinct versions of the component sit at this place — more than one means a single decision cannot honestly cover all of them.
      operationId: decide
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
        - description: Which place, as the findings list gives it
          in: path
          name: place
          required: true
          schema:
            description: Which place, as the findings list gives it
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record a triage decision for a finding
      tags:
        - Triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/places/{place}/decision/reaffirmation:
    post:
      description: |-
        Re-makes a decision that stopped applying because an upstream version moved, at the versions this finding has now. `previous` is the decision being re-made, from `previously` in `GET .../decision`.

        Only the person who made the original may do this, and it normally needs no second approver: two people already agreed to the claim, and a version bump is a prompt to re-check rather than a new claim.

        It does need approval again if the justification differs from the original, or if the vulnerability's severity has risen since — both mean this is not the claim that was agreed to. The response says which happened.

        `reasoning` is required. "Still true" with nothing behind it is what a re-affirmation becomes when it is made too easy.
      operationId: reaffirm-decision
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - in: path
          name: place
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reaffirm-decisionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Re-affirm a decision after an upstream version changed
      tags:
        - Triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/places/{place}/reach:
    get:
      description: |-
        Returns the three parts of what a judgment made here covers.

        `here` is how many places in this build. `automatic` are other builds it reaches without anybody doing anything, because their upstream versions and chains already match — a decision is a claim about a combination of code, not about a release. `differing` hold the same issue at the same place at another version, so each is a separate judgment.

        Only `differing` is a choice. The first two follow from the matching rules and are there to be told, not agreed to — and showing them as one number is how a decision comes to reach builds the person making it never knew about.
      operationId: get-decision-reach
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - in: path
          name: place
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReachBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show how far a decision here would reach
      tags:
        - Triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/scans:
    get:
      description: |-
        Returns uploads newest first, each with its state: `reading` (accepted, not yet parsed), `scanning` (parsed, vulnerability scan pending), `scanned` (complete), or `failed` with the reason.

        Because uploads return 202 before parsing, this is how a build pipeline finds out whether its SBOM was usable. An API key sees only the uploads it sent itself.
      operationId: list-scans
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: How many to return
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: How many to return
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: How many to skip
          explode: false
          in: query
          name: offset
          schema:
            description: How many to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List uploaded scans and their status
      tags:
        - Ingest
    post:
      description: |-
        Accepts a CycloneDX SBOM and any number of OpenVEX documents as multipart form fields named `inventory` and `suppressions`.

        The product, branch and variant must already exist; an upload naming something undeclared is rejected and the error says which part is missing.

        **Returns 202 before the documents are parsed.** A success here means they were accepted for processing, not that they were valid. Poll `GET .../scans` to find out whether they parsed and what the scan found.
      operationId: upload-scan
      parameters:
        - description: The declared product this build is of
          in: path
          name: product
          required: true
          schema:
            description: The declared product this build is of
            type: string
        - description: The declared branch or tag
          in: path
          name: stream
          required: true
          schema:
            description: The declared branch or tag
            type: string
        - description: The declared way that stream is built
          in: path
          name: variant
          required: true
          schema:
            description: The declared way that stream is built
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              inventory:
                contentType: application/json,application/octet-stream
              suppressions:
                contentType: application/json,application/octet-stream
            schema:
              properties:
                inventory:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
                suppressions:
                  items:
                    contentEncoding: binary
                    contentMediaType: application/octet-stream
                    format: binary
                    type: string
                  type: array
              required:
                - inventory
              type: object
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Upload an SBOM and its VEX documents
      tags:
        - Ingest
  /v1/products/{product}/triage-floor:
    put:
      description: |-
        Sets the least severity worth triaging for one product, overriding what the deployment says. Below the line a finding is still recorded, still counted and still reportable, and it carries no deadline — it is out of the working list, not out of the system.

        An empty value clears the override, so the product follows the deployment again. Clearing is not the same as stating the deployment's current line: a product that stated it would stop following when the deployment changed.

        Deadlines are rewritten afterwards, away from the request, because moving the line moves what is on a clock at all. The response returns before that has finished.
      operationId: set-product-triage-floor
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageFloorBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set what a product considers worth triaging
      tags:
        - Catalog
  /v1/products/{product}/variants:
    get:
      operationId: list-variants
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyVariantBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a product's build variants
      tags:
        - Catalog
    post:
      description: "Records one of the parallel builds of a product — a chip variant, an architecture, an operating system. Declared once for the product, not once per release: a release is filed against it the first time a scan arrives, so nobody restates the list and no release ends up with the name spelled differently."
      operationId: declare-variant
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredVariantBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a build variant
      tags:
        - Catalog
  /v1/review-queue:
    get:
      description: |-
        Returns the claims waiting for a second person, newest first, limited to what you may approve every row of. One entry is one claim — one proposer's action, however many decisions it wrote — with a representative decision and place, how many rows, issues and places it covers, and every build it currently reaches.

        Each entry carries the full reasoning, whether it was previously approved and came back, how long the finding has been deferred in total, and how old the claim is. A claim over many issues also carries `outliers`: the rows that do not look like the rest, which is what to read instead of all of them.

        Approve, send back or set rows aside with `POST /v1/claims/{id}/approval` and `POST /v1/claims/{id}/send-back`.

        **Your own claims are not here.** Approving your own is refused, so a queue containing them is a list of work you cannot do. Ask for `mine=true` to see what you proposed and nobody has agreed to yet, which is a different question.
      operationId: list-review-queue
      parameters:
        - description: Return what you proposed and nobody has agreed to, instead of what is waiting on you
          explode: false
          in: query
          name: mine
          schema:
            description: Return what you proposed and nobody has agreed to, instead of what is waiting on you
            type: boolean
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List claims awaiting approval
      tags:
        - Triage
  /v1/roles/bindings:
    delete:
      description: |-
        Removes one group-to-role mapping.

        It takes effect at each member's next sign-in, because group membership is read at sign-in and never again. To cut somebody off now, end their sessions.
      operationId: unbind-group
      parameters:
        - explode: false
          in: query
          name: group
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: product
          schema:
            type: string
        - explode: false
          in: query
          name: role
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a group-to-role binding
      tags:
        - Administration
    get:
      description: |-
        Lists every group-to-role mapping, and the groups that administer.

        In group-bound mode a mapping is the advance authorization: somebody arriving for the first time in a mapped group is admitted, and somebody in none is refused.
      operationId: list-bindings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyBindingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List group-to-role bindings
      tags:
        - Administration
    post:
      description: |-
        Maps one identity-provider group to one role, so that everybody in that group holds it from their next sign-in.

        Every role but administration names the product it applies to. Administration is bound without one, because it is global rather than held against a product.
      operationId: bind-group
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Bind an identity-provider group to a role
      tags:
        - Administration
  /v1/roles/mode:
    get:
      description: |-
        Says where roles come from here: assigned by an administrator, or derived from the groups an identity provider reports.

        One mode for the whole deployment, never both. A hybrid would need a precedence rule for somebody holding one role from a team and another directly, which is how a stale assignment outlives somebody's removal from the team it was shadowing.
      operationId: get-role-mode
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the role assignment mode
      tags:
        - Administration
    put:
      description: Turning group binding on sets assignments aside rather than deleting them, and turning it off restores them — so trying it is not a one-way door. Refused if it would leave nobody able to administer this deployment.
      operationId: set-role-mode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModeBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set the role assignment mode
      tags:
        - Administration
  /v1/running-out:
    get:
      description: |-
        Returns open findings whose deadline falls within `days`, where nobody has recorded a decision, across every product you can see.

        A deadline that has been answered is not on this list. A dismissal takes a finding off the clock, because the claim is that it will not be fixed, and a deferral replaces the deadline with its own date. What is left is time passing with nothing said.

        The window comes from how urgent a finding is. Being known-exploited has its own and it is the shortest, whatever the severity says. Anything the reports did not rate takes the medium window.

        One row per issue at a component, however many places it sits at. `days_left` is negative once something is overdue.
      operationId: list-running-out
      parameters:
        - description: Limit to one product, by name. Empty means every product you can see
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name. Empty means every product you can see
            type: string
        - description: Limit to one branch or tag. Only meaningful with a product
          explode: false
          in: query
          name: stream
          schema:
            description: Limit to one branch or tag. Only meaningful with a product
            type: string
        - description: Limit to one variant. Only meaningful with a product, and independent of the branch
          explode: false
          in: query
          name: variant
          schema:
            description: Limit to one variant. Only meaningful with a product, and independent of the branch
            type: string
        - description: How far ahead to look
          explode: false
          in: query
          name: days
          schema:
            default: 14
            description: How far ahead to look
            format: int64
            maximum: 365
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyLateBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List findings running out of time that nobody has decided about
      tags:
        - Findings
  /v1/scanning:
    get:
      description: |-
        Returns every build you can see, longest-silent first, with when a scan last arrived for it and whether that is longer ago than this deployment allows.

        A build that stops being scanned reports no new findings and fails nothing, so it looks healthier than one that is still being scanned. A build nothing has ever been filed against is measured from when it was declared.

        How long counts as quiet is the `scanning.quiet-after` setting.
      operationId: list-scanning
      parameters:
        - description: Limit to one product, by name. Empty means every product you can see
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name. Empty means every product you can see
            type: string
        - description: Limit to one branch or tag. Only meaningful with a product
          explode: false
          in: query
          name: stream
          schema:
            description: Limit to one branch or tag. Only meaningful with a product
            type: string
        - description: Limit to one variant. Only meaningful with a product, and independent of the branch
          explode: false
          in: query
          name: variant
          schema:
            description: Limit to one variant. Only meaningful with a product, and independent of the branch
            type: string
        - description: How many to return. Quietest first, so the default is the answer for any estate somebody reads by hand
          explode: false
          in: query
          name: limit
          schema:
            default: 200
            description: How many to return. Quietest first, so the default is the answer for any estate somebody reads by hand
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: How many to skip
          explode: false
          in: query
          name: offset
          schema:
            description: How many to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List when each build was last scanned
      tags:
        - Scans
  /v1/session:
    delete:
      description: Ends the session the request arrived on, everywhere rather than in this browser alone — the session is stored, so it stops working whichever copy of the application answers next.
      operationId: sign-out
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sign out
      tags:
        - Access
  /v1/session/me:
    get:
      description: |-
        Returns the caller, the products they can reach, and what they may do in each one.

        It answers what a screen has to know before it draws: whether to offer an action at all. Without it a client either hides nothing and lets people find the refusal, or re-implements the mapping from roles to capabilities and drifts from the one the server enforces.

        Capabilities, not roles, for that reason. Which roles produce which capability is the server's rule and stays there.
      operationId: get-current-subject
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Describe whoever is asking
      tags:
        - Access
  /v1/settings:
    get:
      description: |-
        Returns every setting an operator may change, its value, and what it decides. `default` means nobody has set it and the shipped value is in use.

        The shipped numbers are a starting point rather than a recommendation. What a deployment can hold to is a question about that deployment, and a deadline nobody agreed to produces an estate that is permanently late and a signal everybody ignores.
      operationId: list-settings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodySettingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List what this deployment has decided
      tags:
        - Administration
  /v1/settings/{name}:
    put:
      description: |-
        Sets one value for everybody here. Durations are written the way Go writes them — `72h`, `30m` — and a value that cannot be read is refused rather than stored, since a setting nothing can parse is a policy silently reverting to the shipped one.

        Only the settings this deployment recognizes may be set. A name it does not know is refused, because storing it would create something nothing ever reads.
      operationId: set-setting
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Set-settingRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change something for this deployment
      tags:
        - Administration
  /v1/sign-in:
    get:
      description: |-
        Returns the sign-in providers this deployment has configured, so a sign-in page can offer them.

        **Answered without a credential**, because it is what somebody sees before they have one. It is the only reading endpoint that is, and it reports names an operator configured and nothing else — no account exists or does not exist as far as this is concerned, which is the disclosure that would matter.
      operationId: list-sign-in-providers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyProviderBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the ways in
      tags:
        - Access
  /v1/tokens:
    get:
      description: |-
        Lists your own personal tokens: what each is called, when it expires and when it was last used. Never anybody else's, and never the secrets.

        A token is a live reference to you rather than a copy of what you could do when it was made, so what one reaches shrinks the moment your roles do.
      operationId: list-my-tokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyTokenBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List your API tokens
      tags:
        - Access
    post:
      description: |-
        Creates a personal token and returns its secret. The secret is shown once and never again — what is stored is a digest.

        Expiry is not optional, and `lifetime` may not exceed the ceiling an administrator has set. A credential that never runs out is one nobody ever revokes, and those are found when somebody leaves and nobody knows what breaks if it is turned off.
      operationId: mint-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an API token
      tags:
        - Access
  /v1/tokens/{name}:
    delete:
      description: |-
        Revokes one of your own tokens by name. It stops working immediately.

        Yours alone. An administrator withdraws anybody else's through the administration paths.
      operationId: revoke-my-token
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke one of your API tokens
      tags:
        - Access
  /v1/trend:
    get:
      description: |-
        Returns the three counts per step, with open split by severity, across every product you can see.

        Three series rather than one, because separately they are three numbers and together they say whether the team is keeping pace: new consistently outrunning resolved is a growing backlog.

        Split by severity because a total that barely moves while its critical share rises is getting worse, and a single line hides exactly that.

        Worked out when it is asked for. Nothing is precomputed or refreshed on a schedule until a measurement says it has to be.
      operationId: get-trend
      parameters:
        - description: Limit to one product, by name. Empty means every product you can see
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name. Empty means every product you can see
            type: string
        - description: Limit to one branch or tag. Only meaningful with a product
          explode: false
          in: query
          name: stream
          schema:
            description: Limit to one branch or tag. Only meaningful with a product
            type: string
        - description: Limit to one variant. Only meaningful with a product, and independent of the branch
          explode: false
          in: query
          name: variant
          schema:
            description: Limit to one variant. Only meaningful with a product, and independent of the branch
            type: string
        - explode: false
          in: query
          name: weeks
          schema:
            default: 12
            format: int64
            maximum: 104
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyPointBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show new, resolved and open over time
      tags:
        - Findings
  /v1/unassigned:
    get:
      description: |-
        Returns open findings with no assignee, across every product you can see, most urgent first.

        Deliberately not scoped to one product: work falling between people is exactly what hides when every screen shows one product and nobody looks at the others.

        **One item per issue in a component in a product, not one per build.** The same code built as several variants is one piece of work — a judgment is keyed on the product and the code rather than on the build, so answering it once answers every build holding the same versions. `builds` says how many that is. Where two builds ship different versions of the component they are different work and appear separately.
      operationId: list-unassigned
      parameters:
        - description: Limit to one product, by name. Empty means every product you can see
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name. Empty means every product you can see
            type: string
        - description: Limit to one branch or tag. Only meaningful with a product
          explode: false
          in: query
          name: stream
          schema:
            description: Limit to one branch or tag. Only meaningful with a product
            type: string
        - description: Limit to one variant. Only meaningful with a product, and independent of the branch
          explode: false
          in: query
          name: variant
          schema:
            description: Limit to one variant. Only meaningful with a product, and independent of the branch
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50

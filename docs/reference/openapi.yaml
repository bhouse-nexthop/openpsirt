components:
  schemas:
    Approve-decisionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Approve-decisionRequest.json
          format: uri
          readOnly: true
          type: string
        batch:
          description: Name a batch to agree to many at once, so it can be undone as one
          type: string
      type: object
    BindingBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BindingBody.json
          format: uri
          readOnly: true
          type: string
        group:
          description: The group as the provider names it — a team slug, or a claim value
          maxLength: 191
          minLength: 1
          type: string
        product:
          description: The product the role is held against
          type: string
        role:
          description: What membership of this group grants
          enum:
            - reporting
            - approver
            - public-read
            - private-read
            - public-triage
            - private-triage
            - admin
          type: string
      required:
        - group
        - role
      type: object
    Comment-on-decisionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Comment-on-decisionRequest.json
          format: uri
          readOnly: true
          type: string
        body:
          minLength: 1
          type: string
      required:
        - body
      type: object
    Comment-on-decisionResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Comment-on-decisionResponse.json
          format: uri
          readOnly: true
          type: string
        id:
          format: int64
          type: integer
      required:
        - id
      type: object
    DecisionBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DecisionBody.json
          format: uri
          readOnly: true
          type: string
        deferred_until:
          description: When a deferral returns, as a date. Required for a deferral
          type: string
        id:
          description: What to name this decision in a later request
          format: int64
          type: integer
        justification:
          description: Why it does not apply. Required when it does not
          enum:
            - component_not_present
            - vulnerable_code_not_present
            - vulnerable_code_not_in_execute_path
            - vulnerable_code_cannot_be_controlled_by_adversary
            - inline_mitigations_already_exist
          type: string
        needs_approval:
          description: Whether a second person has to agree before it takes effect
          type: boolean
        outcome:
          description: What was decided
          enum:
            - affected
            - not-applicable
            - deferred
            - wont-fix
          type: string
        reasoning:
          description: Why, in markdown. Somebody else has to agree with this
          minLength: 1
          type: string
        state:
          description: Where it has got to
          enum:
            - proposed
            - approved
            - withdrawn
            - lapsed
          type: string
      required:
        - outcome
        - reasoning
      type: object
    DeclaredKeyBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredKeyBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/KeyBody"
      required:
        - created
        - item
      type: object
    DeclaredPersonBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredPersonBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/PersonBody"
      required:
        - created
        - item
      type: object
    DeclaredProductBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredProductBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/ProductBody"
      required:
        - created
        - item
      type: object
    DeclaredStreamBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredStreamBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/StreamBody"
      required:
        - created
        - item
      type: object
    DeclaredVariantBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredVariantBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/VariantBody"
      required:
        - created
        - item
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    FindingBody:
      additionalProperties: false
      properties:
        answered:
          description: How many of those the build has already argued do not apply
          format: int64
          type: integer
        component:
          description: What carries it
          type: string
        exploited:
          description: Somebody is known to be exploiting this
          type: boolean
        fix_state:
          description: What upstream has done about it
          enum:
            - fixed
            - none
            - wont-fix
          type: string
        fixed_in:
          description: The version that resolves it, where one exists
          type: string
        places:
          description: How many places this component sits at here
          format: int64
          type: integer
        severity:
          description: As the scanner rated it. A word, not a score
          type: string
        upstream:
          description: What a fork was made from, where it is one
          type: string
        version:
          description: The version that ships
          type: string
        vulnerability:
          description: The issue, under the name it is most widely known by
          type: string
      required:
        - vulnerability
        - component
        - version
        - places
      type: object
    FindingsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FindingsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/FindingBody"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    HeldBody:
      additionalProperties: false
      properties:
        effective:
          description: Whether this grants anything right now
          type: boolean
        product:
          description: The product the role is held against
          minLength: 1
          type: string
        role:
          description: What they may do with it
          enum:
            - reporting
            - approver
            - public-read
            - private-read
            - public-triage
            - private-triage
          type: string
        source:
          description: Whether an administrator assigned this or a group derived it
          enum:
            - assigned
            - derived
          type: string
      required:
        - product
        - role
        - effective
      type: object
    Info:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Info.json
          format: uri
          readOnly: true
          type: string
        commit:
          description: Git commit the binary was built from
          type: string
        date:
          description: Build timestamp, RFC 3339
          type: string
        go:
          description: Go toolchain that produced the binary
          type: string
        version:
          description: Release version, or "dev" for an unreleased build
          type: string
      required:
        - version
        - commit
        - date
        - go
      type: object
    KeyBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/KeyBody.json
          format: uri
          readOnly: true
          type: string
        last_used_at:
          description: When it last sent something
          type: string
        name:
          description: What this credential is for
          maxLength: 191
          minLength: 1
          type: string
        product:
          description: The product it may send scans for. Always required
          minLength: 1
          type: string
        revoked:
          description: Whether it has been withdrawn
          type: boolean
        secret:
          description: Shown once, at creation. It is stored hashed and cannot be shown again
          type: string
        stream:
          description: Optionally, the one release it may send for
          type: string
        variant:
          description: Optionally, the one variant it may send for
          type: string
      required:
        - name
        - product
      type: object
    ListBodyBindingBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListBodyBindingBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/BindingBody"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ListBodyKeyBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListBodyKeyBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/KeyBody"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ListBodyPersonBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListBodyPersonBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/PersonBody"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ListBodyProductBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListBodyProductBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/ProductBody"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ListBodyStreamBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListBodyStreamBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/StreamBody"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ListBodyTokenBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ListBodyTokenBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/TokenBody"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ListBodyVariantBody:
      additionalProperties: false

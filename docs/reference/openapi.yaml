components:
  schemas:
    ApprovalBody:
      additionalProperties: false
      properties:
        approved_at:
          type: string
        approved_by:
          type: string
        batch:
          description: The batch it was approved under, if it was a bulk approval
          type: string
        covered:
          description: Findings this covered when it was agreed to
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        revision_id:
          description: Which revision of the justification was agreed to
          format: int64
          type: integer
        withdrawn_at:
          description: When this approval was taken back, if it was
          type: string
      required:
        - id
        - revision_id
        - approved_by
        - approved_at
      type: object
    Approve-decisionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Approve-decisionRequest.json
          format: uri
          readOnly: true
          type: string
        batch:
          description: Name a batch to agree to many at once, so it can be undone as one
          type: string
      type: object
    AroundBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/AroundBody.json
          format: uri
          readOnly: true
          type: string
        above:
          description: What pulls this in — usually short, and the direction people use
          items:
            $ref: "#/components/schemas/NeighbourBody"
          type:
            - array
            - "null"
        below:
          description: What it pulls in
          items:
            $ref: "#/components/schemas/NeighbourBody"
          type:
            - array
            - "null"
      required:
        - above
        - below
      type: object
    Assign-findingRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Assign-findingRequest.json
          format: uri
          readOnly: true
          type: string
        person:
          description: Their sign-in identity, or empty for nobody
          type: string
      required:
        - person
      type: object
    AtComponentBody:
      additionalProperties: false
      properties:
        fixed_in:
          description: The version the report says fixes it, where it names one
          type: string
        places:
          description: How many places in this build it sits at
          format: int64
          type: integer
        severity:
          description: How bad the report rates it
          type: string
        vulnerability:
          type: string
      required:
        - vulnerability
        - places
      type: object
    BindingBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BindingBody.json
          format: uri
          readOnly: true
          type: string
        group:
          description: The group as the provider names it — a team slug, or a claim value
          maxLength: 191
          minLength: 1
          type: string
        product:
          description: The product the role is held against
          type: string
        role:
          description: What membership of this group grants
          enum:
            - reporting
            - approver
            - public-read
            - private-read
            - public-triage
            - private-triage
            - admin
          type: string
      required:
        - group
        - role
      type: object
    CanBody:
      additionalProperties: false
      properties:
        may_agree:
          description: Agree to somebody else's claim
          type: boolean
        may_hide:
          description: Argue about a finding nobody has disclosed
          type: boolean
        may_report:
          description: Read the reports
          type: boolean
        may_see:
          description: Read findings that have been disclosed
          type: boolean
        may_triage:
          description: Argue about a finding
          type: boolean
        name:
          description: What to show for it
          type: string
        product:
          type: string
        sees_all:
          description: Read findings nobody has disclosed yet
          type: boolean
      required:
        - product
        - name
        - may_see
        - sees_all
        - may_triage
        - may_hide
        - may_agree
        - may_report
      type: object
    CarriedBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CarriedBody.json
          format: uri
          readOnly: true
          type: string
        absent:
          description: Cover nothing in the new line
          format: int64
          type: integer
        applying:
          description: Reach it by matching. Nothing to choose
          format: int64
          type: integer
        moved:
          description: The version differs, so each needs a fresh answer
          items:
            $ref: "#/components/schemas/InheritedBody"
          type:
            - array
            - "null"
        postponed:
          description: Deferrals, offered separately and never carried by default
          items:
            $ref: "#/components/schemas/InheritedBody"
          type:
            - array
            - "null"
      required:
        - applying
        - moved
        - postponed
        - absent
      type: object
    ChangedBody:
      additionalProperties: false
      properties:
        arrived_from:
          description: The version this was bumped from since the earlier build. Only on still-present entries, where it means the bump did not reach the fix
          type: string
        because:
          description: Why it went. Only on fixed entries
          enum:
            - removed
            - upgraded
            - revised
            - superseded
            - unexplained
          type: string
        component:
          type: string
        severity:
          type: string
        vulnerability:
          type: string
      required:
        - vulnerability
        - component
      type: object
    Comment-on-decisionRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Comment-on-decisionRequest.json
          format: uri
          readOnly: true
          type: string
        body:
          minLength: 1
          type: string
      required:
        - body
      type: object
    Comment-on-decisionResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Comment-on-decisionResponse.json
          format: uri
          readOnly: true
          type: string
        id:
          format: int64
          type: integer
      required:
        - id
      type: object
    CommentBody:
      additionalProperties: false
      properties:
        body:
          description: The comment text, in markdown
          type: string
        edited_at:
          description: When the author last changed it, if they did
          type: string
        id:
          format: int64
          type: integer
        written_at:
          type: string
        written_by:
          type: string
      required:
        - id
        - body
        - written_by
        - written_at
      type: object
    Compare-releasesResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Compare-releasesResponse.json
          format: uri
          readOnly: true
          type: string
        fixed:
          items:
            $ref: "#/components/schemas/ChangedBody"
          type:
            - array
            - "null"
        newly_present:
          items:
            $ref: "#/components/schemas/ChangedBody"
          type:
            - array
            - "null"
        still_present:
          items:
            $ref: "#/components/schemas/ChangedBody"
          type:
            - array
            - "null"
      required:
        - fixed
        - newly_present
        - still_present
      type: object
    Decide-togetherRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Decide-togetherRequest.json
          format: uri
          readOnly: true
          type: string
        deferred_until:
          description: Required when it is deferred. A date, as 2026-03-31
          type: string
        justification:
          description: Required when it does not apply
          type: string
        outcome:
          enum:
            - affected
            - not-applicable
            - deferred
            - wont-fix
          type: string
        reasoning:
          description: Why this holds for every issue named
          minLength: 1
          type: string
        selected_by:
          description: How you narrowed this set. Recorded, and never part of the claim
          maxLength: 500
          minLength: 1
          type: string
        vulnerabilities:
          description: The issues this claim covers, by name
          items:
            type: string
          maxItems: 2000
          minItems: 1
          type:
            - array
            - "null"
      required:
        - vulnerabilities
        - selected_by
        - outcome
        - reasoning
      type: object
    Decide-togetherResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Decide-togetherResponse.json
          format: uri
          readOnly: true
          type: string
        ids:
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        recorded:
          format: int64
          type: integer
      required:
        - recorded
        - ids
      type: object
    DecisionBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DecisionBody.json
          format: uri
          readOnly: true
          type: string
        deferred_until:
          description: When a deferral returns, as a date. Required for a deferral
          type: string
        id:
          description: What to name this decision in a later request
          format: int64
          type: integer
        justification:
          description: Why it does not apply. Required when it does not
          enum:
            - component_not_present
            - vulnerable_code_not_present
            - vulnerable_code_not_in_execute_path
            - vulnerable_code_cannot_be_controlled_by_adversary
            - inline_mitigations_already_exist
          type: string
        needs_approval:
          description: Whether a second person has to agree before it takes effect
          type: boolean
        outcome:
          description: What was decided
          enum:
            - affected
            - not-applicable
            - deferred
            - wont-fix
          type: string
        places:
          description: How many findings this decision covers
          format: int64
          type: integer
        reasoning:
          description: Why, in markdown. Somebody else has to agree with this
          minLength: 1
          type: string
        selected_by:
          description: How the set was narrowed, for a claim recorded as one of many. Never part of the claim itself
          type: string
        sent_back_at:
          description: When an approver last asked for more. Empty means nobody has
          type: string
        state:
          description: Where it has got to
          enum:
            - proposed
            - approved
            - withdrawn
            - lapsed
          type: string
        versions:
          description: How many versions of the component sit here. More than one needs care
          format: int64
          type: integer
      required:
        - outcome
        - reasoning
      type: object
    DecisionDetail:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DecisionDetail.json
          format: uri
          readOnly: true
          type: string
        age_days:
          description: How long the claim has stood. An old judgment should look like one
          format: int64
          type: integer
        decision:
          $ref: "#/components/schemas/DecisionBody"
        place:
          $ref: "#/components/schemas/PlaceBody"
        proposed_at:
          description: When the claim was made, as a date and time
          type: string
        proposed_by:
          type: string
        reasoning:
          description: The justification as it currently stands, in markdown
          type: string
      required:
        - decision
        - place
        - reasoning
        - proposed_by
        - proposed_at
        - age_days
      type: object
    DecisionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DecisionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/DecisionDetail"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    DeclaredKeyBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredKeyBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/KeyBody"
      required:
        - created
        - item
      type: object
    DeclaredPersonBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredPersonBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/PersonBody"
      required:
        - created
        - item
      type: object
    DeclaredProductBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredProductBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/ProductBody"
      required:
        - created
        - item
      type: object
    DeclaredStreamBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredStreamBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/StreamBody"
      required:
        - created
        - item
      type: object
    DeclaredVariantBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/DeclaredVariantBody.json
          format: uri
          readOnly: true
          type: string
        created:
          type: boolean
        item:
          $ref: "#/components/schemas/VariantBody"
      required:
        - created
        - item
      type: object
    Edit-commentRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Edit-commentRequest.json
          format: uri
          readOnly: true
          type: string
        body:
          minLength: 1
          type: string
      required:
        - body
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    EvidenceBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/EvidenceBody.json
          format: uri
          readOnly: true
          type: string
        advisory:
          description: Where the issue is written up
          type: string
        aliases:
          description: Other names the same issue is known by
          items:
            type: string
          type:
            - array
            - "null"
        arrived_from:
          description: The version this was bumped from, where the bump did not resolve it
          type: string
        component:
          type: string
        description:
          type: string
        exploited:
          description: Somebody is known to be exploiting this
          type: boolean
        fix_state:
          enum:
            - fixed
            - none
            - wont-fix
          type: string
        fixed_at:
          description: When that version became available
          type: string
        fixed_in:
          description: The version that resolves it
          type: string
        likelihood:
          description: Published probability of exploitation, 0 to 1
          format: double
          type: number
        places:
          items:
            $ref: "#/components/schemas/SittingBody"
          type:
            - array
            - "null"
        references:
          items:
            $ref: "#/components/schemas/ReferenceBody"
          type:
            - array
            - "null"
        score:
          description: The same judgment as a number, where one is published
          format: double
          type: number
        severity:
          description: As the data rates it. A word
          type: string
        upstream:
          description: What a fork was made from, where it is one
          type: string
        vector:
          description: What the score assumes — reachability, privilege, interaction
          type: string
        version:
          type: string
        vulnerability:
          type: string
        weaknesses:
          description: What kind of flaw this is, as CWE identifiers
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - vulnerability
        - component
        - version
        - places
      type: object
    FindingBody:
      additionalProperties: false
      properties:
        answered:
          description: How many of those the build has already argued do not apply
          format: int64
          type: integer
        component:
          description: What carries it
          type: string
        exploited:
          description: Somebody is known to be exploiting this
          type: boolean
        fix_state:
          description: What upstream has done about it
          enum:
            - fixed
            - none
            - wont-fix
          type: string
        fixed_in:
          description: The version that resolves it, where one exists
          type: string
        likelihood:
          description: Published estimate that this will be exploited, 0 to 1
          format: double
          type: number
        places:
          description: How many places this component sits at here
          format: int64
          type: integer
        score:
          description: The severity as a number, which is what the order compares
          format: double
          type: number
        severity:
          description: As the scanner rated it. A word, not a score
          type: string
        upstream:
          description: What a fork was made from, where it is one
          type: string
        version:
          description: The version that ships
          type: string
        vulnerability:
          description: The issue, under the name it is most widely known by
          type: string
      required:
        - vulnerability
        - component
        - version
        - places
      type: object
    FindingsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/FindingsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/FindingBody"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    HeldBody:
      additionalProperties: false
      properties:
        effective:
          description: Whether this grants anything right now
          type: boolean
        product:
          description: The product the role is held against
          minLength: 1
          type: string
        role:
          description: What they may do with it
          enum:
            - reporting
            - approver
            - public-read
            - private-read
            - public-triage
            - private-triage
          type: string
        source:
          description: Whether an administrator assigned this or a group derived it
          enum:
            - assigned
            - derived
          type: string
      required:
        - product
        - role
        - effective
      type: object
    HoldingBody:
      additionalProperties: false
      properties:
        open:
          description: Open findings assigned to them
          format: int64
          type: integer
        overdue:
          description: How many of those are past their deadline
          format: int64
          type: integer
        person:
          type: string
      required:
        - person
        - open
        - overdue
      type: object
    Info:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Info.json
          format: uri
          readOnly: true
          type: string
        commit:
          description: Git commit the binary was built from
          type: string
        date:
          description: Build timestamp, RFC 3339
          type: string
        go:
          description: Go toolchain that produced the binary
          type: string
        version:
          description: Release version, or "dev" for an unreleased build
          type: string
      required:
        - version
        - commit
        - date
        - go
      type: object
    InheritedBody:
      additionalProperties: false
      properties:
        component:
          type: string
        decision:
          format: int64
          type: integer
        deferred_days:
          description: How long this has already been put off, across every line it has been carried through
          format: int64
          type: integer
        now:
          description: What the new line has
          type: string
        outcome:
          type: string
        reasoning:
          description: The old words, to start from rather than start without
          type: string
        vulnerability:
          type: string
        was:
          description: The version the claim was made against
          type: string
      required:
        - decision
        - vulnerability
        - component
        - outcome
        - was
        - now
        - reasoning
      type: object
    KeyBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/KeyBody.json
          format: uri
          readOnly: true
          type: string
        last_used_at:
          description: When it last sent something
          type: string
        name:
          description: What this credential is for
          maxLength: 191
          minLength: 1
          type: string
        product:
          description: The product it may send scans for. Always required
          minLength: 1
          type: string
        revoked:
          description: Whether it has been withdrawn
          type: boolean
        secret:
          description: Shown once, at creation. It is stored hashed and cannot be shown again
          type: string
        stream:
          description: Optionally, the one release it may send for
          type: string
        variant:
          description: Optionally, the one variant it may send for
          type: string
      required:
        - name
        - product
      type: object
    LateBody:
      additionalProperties: false
      properties:
        assigned_to:
          description: Empty means nobody, or not everywhere the same person
          type: string
        component:
          type: string
        days_left:
          description: Negative once it is overdue
          format: int64
          type: integer
        due:
          description: When it is due, as a date
          type: string
        exploited:
          type: boolean
        places:
          description: How many places in that build this sits at
          format: int64
          type: integer
        product:
          type: string
        severity:
          type: string
        stream:
          type: string
        variant:
          type: string
        vulnerability:
          type: string
      required:
        - vulnerability
        - component
        - product
        - stream
        - variant
        - places
        - due
        - days_left
      type: object
    List-issues-at-componentResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/List-issues-at-componentResponse.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/AtComponentBody"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    List-unassignedResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/List-unassignedResponse.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/UnassignedBody"
          type:
            - array
            - "null"
        total:
          format: int64
          type: integer
      required:
        - items
        - total
      type: object
    ListBodyApprovalBody:
      additionalProperties: false
      properties:
        $schema:

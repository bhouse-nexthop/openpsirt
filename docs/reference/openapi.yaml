info:
  description: Track vulnerabilities in the products you ship.
  title: OpenPSIRT
  version: dev
openapi: 3.1.0
paths:
  /v1/approval-batches/{batch}:
    delete:
      description: |-
        Withdraws every approval recorded under this batch name, returning those decisions to the review queue. The decisions themselves stand — only the approvals are undone. Returns how many were affected.

        Only decisions on products you may triage are touched.
      operationId: undo-batch
      parameters:
        - in: path
          name: batch
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Undo-batchResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Undo a bulk approval
      tags:
        - Triage
  /v1/assignments:
    get:
      description: |-
        Returns everyone holding open findings you can see, with how many.

        The number worth watching is not how many findings exist but how many are waiting behind somebody: an idle account holding nothing is harmless, and work stuck behind a person who has gone is the problem — nothing tells this software that somebody has left.
      operationId: list-holdings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyHoldingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List how much each person is dealing with
      tags:
        - Findings
  /v1/comments/{id}:
    put:
      description: |-
        Replaces the text of a comment. Only its author may do this, and the new text overwrites the old rather than being kept as a revision — a comment is a remark, not a justification.

        The text is markdown and is validated before it is stored; a 422 names the line and the offending text.
      operationId: edit-comment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Edit-commentRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Edit a comment
      tags:
        - Triage
  /v1/decisions:
    get:
      description: |-
        Returns triage decisions on products you may triage, newest first, with the justification text for each.

        Filter by `outcome` to list dismissals (`not-applicable`, `wont-fix`) or postponements (`deferred`), by `state` to separate what is approved from what is still waiting or has been withdrawn, and by `product` to limit to one product.

        Set `expired=true` to list deferrals whose date has passed — the findings that have come back and need judging again.
      operationId: list-decisions
      parameters:
        - description: Limit to one product, by name
          explode: false
          in: query
          name: product
          schema:
            description: Limit to one product, by name
            type: string
        - description: Limit to one outcome
          explode: false
          in: query
          name: outcome
          schema:
            description: Limit to one outcome
            enum:
              - affected
              - not-applicable
              - deferred
              - wont-fix
            type: string
        - description: Limit to one state
          explode: false
          in: query
          name: state
          schema:
            description: Limit to one state
            enum:
              - proposed
              - approved
              - withdrawn
              - lapsed
            type: string
        - description: Only deferrals whose date has passed
          explode: false
          in: query
          name: expired
          schema:
            description: Only deferrals whose date has passed
            type: boolean
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List triage decisions
      tags:
        - Triage
  /v1/decisions/{id}:
    delete:
      description: Withdraws the decision so it no longer applies to any finding. The record is kept — a withdrawn decision reads as proposed, approved, then withdrawn. Requires no approval.
      operationId: withdraw-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw a triage decision
      tags:
        - Triage
    get:
      description: |-
        Returns one decision with the justification as it currently stands, where it applies, who proposed it and how long it has stood.

        For the earlier justifications see `GET /v1/decisions/{id}/revisions`, and for who agreed to which of them see `GET /v1/decisions/{id}/approvals`.
      operationId: get-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionDetail"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a triage decision
      tags:
        - Triage
  /v1/decisions/{id}/approval:
    post:
      description: |-
        Approves a proposed decision. Returns 409 if you proposed it yourself — the proposer and approver must always be different people, and there is no override.

        An approval is recorded against the specific revision of the justification that exists now. Editing the justification afterwards withdraws the approval and returns the decision to this queue.

        Pass `batch` to approve many decisions under one name, so they can be undone together with `DELETE /v1/approval-batches/{batch}`.
      operationId: approve-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Approve-decisionRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve a triage decision
      tags:
        - Triage
  /v1/decisions/{id}/approvals:
    get:
      description: |-
        Returns every approval recorded against this decision, including ones later withdrawn, each naming the revision of the justification it was given for.

        A withdrawn approval is kept rather than deleted: who agreed to what, and when it stopped counting, is part of the record.

        `covered` is how many findings the claim covered **when it was agreed to**. A decision applies to every build running the same versions, so it covers more as builds appear — with nobody acting, and nobody having agreed to the larger number. Comparing this against what it covers now is the point of keeping it.
      operationId: list-decision-approvals
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyApprovalBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List who approved a decision
      tags:
        - Triage
  /v1/decisions/{id}/comments:
    get:
      description: |-
        Returns the comments on a decision, oldest first, with who wrote each and when. A comment that has been edited also carries when it was last changed.

        Comments are separate from the justification and never affect an approval.
      operationId: list-decision-comments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyCommentBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List comments on a decision
      tags:
        - Triage
    post:
      description: |-
        Adds a markdown comment to a decision. Comments are separate from the justification and never affect an approval, so an approved decision can be annotated at any time.

        A comment may later be edited by its author only, and editing overwrites it rather than keeping revisions.
      operationId: comment-on-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Comment-on-decisionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment-on-decisionResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Add a comment to a decision
      tags:
        - Triage
  /v1/decisions/{id}/reasoning:
    put:
      description: |-
        Replaces the justification text with a new revision. Earlier revisions are kept and remain readable.

        **This withdraws any existing approval** and returns the decision to the review queue, marked as previously approved. Requires no approval of its own.

        The text is markdown and is validated before it is stored; a 422 names the line and the offending text.
      operationId: revise-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Revise-decisionRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a decision's justification
      tags:
        - Triage
  /v1/decisions/{id}/revisions:
    get:
      description: |-
        Returns every revision of the justification, oldest first, with who wrote each and when.

        An approval names the specific revision that was agreed to, so this is how to read what an approver actually saw rather than what the text says now.
      operationId: list-decision-revisions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyRevisionBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a decision's justification history
      tags:
        - Triage
  /v1/decisions/{id}/send-back:
    post:
      description: |-
        Asks the author for more before agreeing. The claim leaves the review queue and comes back when they revise it.

        `because` is required and is recorded as a comment, because that is what it is — the author needs the words, and a reason kept anywhere else is one nobody reads. Sending something back without saying what is missing is a round trip nobody learns from.

        Needs no approval of its own: it puts risk back on the table rather than taking it off. You cannot send back a claim whose current words are your own — that is yours to revise.
      operationId: send-decision-back
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Send-decision-backRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Send a decision back for more
      tags:
        - Triage
  /v1/keys:
    get:
      description: "Which credentials exist, what each may send, when it was last used and whether it still works. The secrets are not here and cannot be: what is stored is a digest."
      operationId: list-keys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyKeyBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List API keys
      tags:
        - Administration
    post:
      description: "Creates a credential a build may send scans with, and returns its secret. The secret is shown once and stored hashed: a credential store that can hand back what it holds gives up every pipeline's key with a copy of the database."
      operationId: create-key
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredKeyBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an API key
      tags:
        - Administration
  /v1/keys/{name}:
    delete:
      description: Stops it working, without removing the record of what it sent. Revoking one credential leaves every other pipeline running.
      operationId: revoke-key
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke an API key
      tags:
        - Administration
  /v1/people:
    get:
      description: |-
        Lists everybody who may sign in, with the roles each of them holds and the products those apply to.

        Nobody appears here by having authenticated. Access is granted in advance, so this list is what an administrator has decided rather than who has turned up.
      operationId: list-people
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyPersonBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List users
      tags:
        - Administration
    post:
      description: Records somebody so that they may sign in, and optionally what they hold. Recording the same person again confirms them and adds any roles named.
      operationId: record-person
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredPersonBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a user and grant roles
      tags:
        - Administration
  /v1/people/tokens:
    get:
      description: |-
        Lists every personal token in the deployment, whose it is, what it may send and when it was last used.

        Without it a stale token is found only when somebody leaves and nobody knows what breaks if it is turned off.
      operationId: list-all-tokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyTokenBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List all users' API tokens
      tags:
        - Administration
  /v1/people/{identity}/assignments/release:
    post:
      description: |-
        Returns all their open findings to the unassigned list. For when somebody has left, or their last role is removed.

        Nothing tells this software that somebody has gone — membership is read at sign-in, and a person who has left never signs in again. So this is an action an administrator takes rather than something that happens on its own, and until it is taken their work is in no list at all: not in the shared one because it is assigned, and not in anybody's own because they are not here.

        Send `to` instead to hand it to a named person rather than to nobody.
      operationId: release-assignments
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Release-assignmentsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Release-assignmentsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Hand back everything one person is dealing with
      tags:
        - Administration
  /v1/people/{identity}/roles/{product}/{role}:
    delete:
      description: |-
        Withdraws one role from one person. Takes effect at their next request; end their sessions to cut them off now.

        If it was their last role on that product, everything they were dealing with there goes back to the unassigned list. Otherwise that work is in no list at all: not in the shared one because it is assigned, and not in theirs because they can no longer open it. `released` says how much moved.

        The grant is removed rather than marked as ended. What somebody used to hold is answered by the record of what they did, so this list only ever says what is true today.
      operationId: withdraw-role
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: role
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdraw-roleResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke a user's role on a product
      tags:
        - Administration
  /v1/people/{identity}/sessions:
    delete:
      description: Takes effect at once, whichever copy of the application answers next. Roles and group mappings are re-read at sign-in, so withdrawing one takes effect then; this is what makes somebody leaving immediate instead.
      operationId: end-sessions
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: End all of a user's sessions
      tags:
        - Administration
  /v1/people/{identity}/tokens/{name}:
    delete:
      description: |-
        Revokes one person's token on their behalf. It stops working immediately; the record of what it sent stays.

        An owner withdraws their own through their own token paths. This is for the ones whose owner is no longer here to do it.
      operationId: revoke-anyones-token
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke another user's API token
      tags:
        - Administration
  /v1/products:
    get:
      description: |-
        Lists the products declared here, with what each one holds.

        A scan may only be filed against something declared, so this is the first question to ask after an upload is refused for naming something unknown.
      operationId: list-products
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyProductBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List products
      tags:
        - Catalog
    post:
      description: Records a product so scans may be filed against it. Declaring one that already exists succeeds without changing anything, so this can run on every build.
      operationId: declare-product
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredProductBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a product
      tags:
        - Catalog
  /v1/products/{product}/comparison:
    get:
      description: |-
        Returns what was fixed, what is newly present, and what is still there between two builds of one product.

        Between **any** two, not only adjacent ones: what a release note has to answer is usually about the last release a customer has, which is rarely the previous one.

        Each fixed entry says why it went, because "fixed by upgrading" and "fixed by a carried patch" are different sentences to a reader. `superseded` is the one to read carefully — it means the version moved and the issue came with it, so it was not fixed at all.

        A still-present entry carrying `arrived_from` is the same failure seen from the other side: somebody moved that version since the earlier build and the issue came with it, so the bump did not reach the fix.

        **Public findings only unless you ask otherwise.** Its destination is usually a public document, so including something undisclosed should be deliberate rather than something pasted in without noticing.
      operationId: compare-releases
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: The earlier build's stream — a branch or a tag
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: The earlier build's stream — a branch or a tag
            type: string
        - description: The earlier build's variant
          explode: false
          in: query
          name: from_variant
          required: true
          schema:
            description: The earlier build's variant
            type: string
        - description: The later build's stream
          explode: false
          in: query
          name: to
          required: true
          schema:
            description: The later build's stream
            type: string
        - description: The later build's variant
          explode: false
          in: query
          name: to_variant
          required: true
          schema:
            description: The later build's variant
            type: string
        - description: Include findings nobody has disclosed
          explode: false
          in: query
          name: include_undisclosed
          schema:
            description: Include findings nobody has disclosed
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compare-releasesResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Compare two builds
      tags:
        - Findings
  /v1/products/{product}/mentionable:
    get:
      description: |-
        Returns the people who can already read findings of this visibility in this product, so an editor can offer them.

        Only people who can already see the thing. An autocomplete listing everybody teaches somebody to name a colleague who then cannot open what they were called to — and on an undisclosed finding, the mention itself says a finding exists, which is the disclosure the visibility rule prevents.

        `visibility` says which kind of finding the text is about. Asking about undisclosed findings requires being able to read them.
      operationId: list-mentionable
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - description: Which kind of finding the text is about
          explode: false
          in: query
          name: visibility
          schema:
            default: public
            description: Which kind of finding the text is about
            enum:
              - public
              - private
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 25
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyMentionableBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List who may be mentioned here
      tags:
        - Triage
  /v1/products/{product}/streams:
    get:
      operationId: list-streams
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyStreamBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a product's branches and tags
      tags:
        - Catalog
    post:
      description: Records a line of a product. A branch moves and is rebuilt; a tag never changes and is what somebody received.
      operationId: declare-stream
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredStreamBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a branch or tag
      tags:
        - Catalog
  /v1/products/{product}/streams/{stream}/variants:
    get:
      description: |-
        Lists the variants one release was actually built as — a subset of what the product declares.

        A release predating a variant has never been filed against it and does not list it, which is what keeps something introduced later from appearing to have shipped years ago.
      operationId: list-release-variants
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyVariantBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the variants a release was built as
      tags:
        - Catalog
  /v1/products/{product}/streams/{stream}/variants/{variant}/carried:
    get:
      description: |-
        Returns what an existing line's decisions would mean for this one, without changing anything. Ask before creating a line, because the answer is what somebody is agreeing to — a carry that happens silently is one nobody reviews.

        Four groups, because they need four different things:

        `applying` reach this line by matching. Nothing to choose; a decision is a claim about a combination of code rather than about a release.

        `moved` held a claim at a version this line does not have. Each would come across as a **proposal carrying the old reasoning** — never as a decision, because the version moved and the old conclusion is not a conclusion about the new code. Making somebody start from a blank page, having thrown away what was written last time, is how a tool teaches people to stop writing reasoning at all.

        `postponed` were deferrals. "Not this sprint" was about that sprint, so carrying one silently gives a new line expiry dates nobody chose. Each says how long it has already been put off across every line it has come through, because that total is what carrying it again agrees to.

        `absent` cover nothing here and are left behind.
      operationId: preview-carried-decisions
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The stream to inherit from
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: The stream to inherit from
            type: string
        - description: That stream's variant
          explode: false
          in: query
          name: from_variant
          required: true
          schema:
            description: That stream's variant
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarriedBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show what triage a new line would inherit
      tags:
        - Triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/components:
    get:
      description: |-
        Returns the components the build itself depends on, most findings first.

        The starting point for walking the graph. A full render is not offered and would not be useful: a real image holds thousands of components and tens of thousands of edges, which neither draws nor reads. Ask for one step at a time.

        Every entry carries how many findings are open against it and how many components it pulls in, so descending follows something rather than being exploration.
      operationId: list-top-level-components
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyNeighbourBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List what a build pulls in directly
      tags:
        - Findings
  /v1/products/{product}/streams/{stream}/variants/{variant}/components/{component}/around:
    get:
      description: |-
        Returns what pulls this component in, and what it pulls in.

        `above` is the direction people actually use. Somebody arrives from a finding and asks why the component is here, which is walking up — and up is short. Walking down is where the size lives.

        A component reached several ways appears once with several parents. It is a graph rather than a tree, so anything drawing it has to expect the same component under many places.
      operationId: get-component-neighbours
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The component's name, as the findings list gives it
          in: path
          name: component
          required: true
          schema:
            description: The component's name, as the findings list gives it
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AroundBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show what is directly above and below a component
      tags:
        - Findings
  /v1/products/{product}/streams/{stream}/variants/{variant}/components/{component}/decisions:
    post:
      description: |-
        Records the same claim against every issue you name: one outcome, one justification, one reasoning, and a separate decision for every place each issue sits at, each keyed and expiring on its own.

        You name the issues; the places are resolved here. `selected_by` says how you narrowed the list and is recorded with every claim, so "how were these chosen" has an answer later — but it is never the claim. The reasoning has to hold for every issue in the list, since "these matched a word" is not a defence anybody would accept.

        Always needs a second person to agree, whatever the outcome.

        Bounded. At most 2000 names per request, and a limit on how many findings one action may write, set under `triage.together-cap`. The limit is checked against the findings this resolves to, which is more than the number of names.
      operationId: decide-together
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: component
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Decide-togetherRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decide-togetherResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record one judgment about several issues at once
      tags:
        - Triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/components/{component}/issues:
    get:
      description: |-
        Returns the distinct issues open against this component in this build, most urgent first, with how many places each sits at and the version that fixes it where the report names one.

        `contains` matches the text of a report. It narrows a list; it is not part of any claim made afterwards.
      operationId: list-issues-at-component
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: component
          required: true
          schema:
            type: string
        - description: Match the text of the report
          explode: false
          in: query
          name: contains
          schema:
            description: Match the text of the report
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-issues-at-componentResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the issues open against one component
      tags:
        - Triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings:
    get:
      description: |-
        Returns one row per vulnerability-and-component pair, not one row per place the component appears. Each row gives the number of places it occupies and how many of those the build's VEX documents already answer.

        Grouping matters at real scale: one switch image produced 335,021 individual findings, which collapse to 7,906 rows here.

        Ordered by urgency — known-exploited first, then whether the build ships to customers, then likelihood, then severity. Supports limit and offset.
      operationId: list-findings
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: How many to return
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: How many to return
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: How many to skip
          explode: false
          in: query
          name: offset
          schema:
            description: How many to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List vulnerability findings
      tags:
        - Findings
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/components/{component}:
    get:
      description: |-
        Returns the full record for one issue in one component of a build: the description, the advisory, every reference the data carries with patches listed first, the score and what it assumes, whether it is known to be exploited and how likely exploitation is, the weakness classification, what upstream has done about it, and every place the component sits at here.

        This is what a triage decision is made from, so it is gathered into one request. Each entry in `places` carries the `place` identity to name when recording a decision about it.

        **A component name is not unique within a build.** Where one ships at several versions, `version` says which — without it, a name that matches more than one is refused rather than guessed at.
      operationId: get-finding
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
        - description: The component's name, as the findings list gives it
          in: path
          name: component
          required: true
          schema:
            description: The component's name, as the findings list gives it
            type: string
        - description: Which version, where the build ships that name at more than one
          explode: false
          in: query
          name: version
          schema:
            description: Which version, where the build ships that name at more than one
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get everything known about one finding
      tags:
        - Findings
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/components/{component}/assignment:
    put:
      description: |-
        Records who is dealing with this issue in this component. It covers every place the component sits at in this build, because they are the same problem seen from several parents.

        Send `person` as an empty string to hand it back to nobody. Handing back is the same operation as giving out, so there is one path rather than two that drift.

        Findings arriving later under the same component start unassigned.
      operationId: assign-finding
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - in: path
          name: component
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Assign-findingRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Assign a finding to somebody
      tags:
        - Findings
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/places/{place}/decision:
    get:
      description: |-
        Returns the decision currently suppressing this finding, if any, together with everything decided here before — withdrawn claims, and claims that stopped applying when an upstream version changed.

        `standing` is absent when nothing has been decided, or when a claim is still waiting for approval: a claim nobody has agreed to suppresses nothing.

        Read `previously` before deciding again. A claim that lapsed on a version bump is usually still the right answer, and re-affirming it is a different request from making a new one.
      operationId: get-finding-decision
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
        - description: Which place, as the findings list gives it
          in: path
          name: place
          required: true
          schema:
            description: Which place, as the findings list gives it
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get what has been decided about a finding
      tags:
        - Triage
    post:
      description: |-
        Records how a finding was triaged: `affected`, `not-applicable`, `deferred` or `wont-fix`.

        `not-applicable` requires a `justification` from the standard VEX vocabulary. `deferred` requires `deferred_until` as a date.

        The decision applies to every build running the same component and consumer upstream versions, including future releases — it is matched by code, not copied between releases. It stops applying automatically when either upstream version changes.

        The response says whether a second person must approve it. Most outcomes require approval; a deferral shorter than the configured threshold does not.

        It also says how many findings this one judgment covers, and how many distinct versions of the component sit at this place — more than one means a single decision cannot honestly cover all of them.
      operationId: decide
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
        - description: Which place, as the findings list gives it
          in: path
          name: place
          required: true
          schema:
            description: Which place, as the findings list gives it
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Record a triage decision for a finding
      tags:
        - Triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/places/{place}/decision/reaffirmation:
    post:
      description: |-
        Re-makes a decision that stopped applying because an upstream version moved, at the versions this finding has now. `previous` is the decision being re-made, from `previously` in `GET .../decision`.

        Only the person who made the original may do this, and it normally needs no second approver: two people already agreed to the claim, and a version bump is a prompt to re-check rather than a new claim.

        It does need approval again if the justification differs from the original, or if the vulnerability's severity has risen since — both mean this is not the claim that was agreed to. The response says which happened.

        `reasoning` is required. "Still true" with nothing behind it is what a re-affirmation becomes when it is made too easy.
      operationId: reaffirm-decision
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - in: path
          name: place
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reaffirm-decisionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Re-affirm a decision after an upstream version changed
      tags:
        - Triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/places/{place}/reach:
    get:
      description: |-
        Returns the three parts of what a judgment made here covers.

        `here` is how many places in this build. `automatic` are other builds it reaches without anybody doing anything, because their upstream versions and chains already match — a decision is a claim about a combination of code, not about a release. `differing` hold the same issue at the same place at another version, so each is a separate judgment.

        Only `differing` is a choice. The first two follow from the matching rules and are there to be told, not agreed to — and showing them as one number is how a decision comes to reach builds the person making it never knew about.
      operationId: get-decision-reach
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - in: path
          name: vulnerability
          required: true
          schema:
            type: string
        - in: path
          name: place
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReachBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show how far a decision here would reach
      tags:
        - Triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/scans:
    get:
      description: |-
        Returns uploads newest first, each with its state: `reading` (accepted, not yet parsed), `scanning` (parsed, vulnerability scan pending), `scanned` (complete), or `failed` with the reason.

        Because uploads return 202 before parsing, this is how a build pipeline finds out whether its SBOM was usable. An API key sees only the uploads it sent itself.
      operationId: list-scans
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: How many to return
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: How many to return
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: How many to skip
          explode: false
          in: query
          name: offset
          schema:
            description: How many to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List uploaded scans and their status
      tags:
        - Ingest
    post:
      description: |-
        Accepts a CycloneDX SBOM and any number of OpenVEX documents as multipart form fields named `inventory` and `suppressions`.

        The product, branch and variant must already exist; an upload naming something undeclared is rejected and the error says which part is missing.

        **Returns 202 before the documents are parsed.** A success here means they were accepted for processing, not that they were valid. Poll `GET .../scans` to find out whether they parsed and what the scan found.
      operationId: upload-scan
      parameters:
        - description: The declared product this build is of
          in: path
          name: product
          required: true
          schema:
            description: The declared product this build is of
            type: string
        - description: The declared branch or tag
          in: path
          name: stream
          required: true
          schema:
            description: The declared branch or tag
            type: string
        - description: The declared way that stream is built
          in: path
          name: variant
          required: true
          schema:
            description: The declared way that stream is built
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              inventory:
                contentType: application/json,application/octet-stream
              suppressions:
                contentType: application/json,application/octet-stream
            schema:
              properties:
                inventory:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
                suppressions:
                  items:
                    contentEncoding: binary
                    contentMediaType: application/octet-stream
                    format: binary
                    type: string
                  type: array
              required:
                - inventory
              type: object
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Upload an SBOM and its VEX documents
      tags:
        - Ingest
  /v1/products/{product}/variants:
    get:
      operationId: list-variants
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyVariantBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a product's build variants
      tags:
        - Catalog
    post:
      description: "Records one of the parallel builds of a product — a chip variant, an architecture, an operating system. Declared once for the product, not once per release: a release is filed against it the first time a scan arrives, so nobody restates the list and no release ends up with the name spelled differently."
      operationId: declare-variant
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredVariantBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a build variant
      tags:
        - Catalog
  /v1/review-queue:
    get:
      description: |-
        Returns triage decisions proposed but not yet approved, limited to products you hold a triage role on.

        Each row includes the full justification text, whether the decision was previously approved and came back, how long the finding has been deferred in total, and how old the claim is — enough to judge it without a second request.
      operationId: list-review-queue
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List decisions awaiting approval
      tags:
        - Triage
  /v1/roles/bindings:
    delete:
      description: |-
        Removes one group-to-role mapping.

        It takes effect at each member's next sign-in, because group membership is read at sign-in and never again. To cut somebody off now, end their sessions.
      operationId: unbind-group
      parameters:
        - explode: false
          in: query
          name: group
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: product
          schema:
            type: string
        - explode: false
          in: query
          name: role
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a group-to-role binding
      tags:
        - Administration
    get:
      description: |-
        Lists every group-to-role mapping, and the groups that administer.

        In group-bound mode a mapping is the advance authorization: somebody arriving for the first time in a mapped group is admitted, and somebody in none is refused.
      operationId: list-bindings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyBindingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List group-to-role bindings
      tags:
        - Administration
    post:
      description: |-
        Maps one identity-provider group to one role, so that everybody in that group holds it from their next sign-in.

        Every role but administration names the product it applies to. Administration is bound without one, because it is global rather than held against a product.
      operationId: bind-group
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Bind an identity-provider group to a role
      tags:
        - Administration
  /v1/roles/mode:
    get:
      description: |-
        Says where roles come from here: assigned by an administrator, or derived from the groups an identity provider reports.

        One mode for the whole deployment, never both. A hybrid would need a precedence rule for somebody holding one role from a team and another directly, which is how a stale assignment outlives somebody's removal from the team it was shadowing.
      operationId: get-role-mode
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the role assignment mode
      tags:
        - Administration
    put:
      description: Turning group binding on sets assignments aside rather than deleting them, and turning it off restores them — so trying it is not a one-way door. Refused if it would leave nobody able to administer this deployment.
      operationId: set-role-mode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModeBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set the role assignment mode
      tags:
        - Administration
  /v1/running-out:
    get:
      description: |-
        Returns open findings whose deadline falls within `days`, where nobody has recorded a decision, across every product you can see.

        A deadline that has been answered is not on this list. A dismissal takes a finding off the clock, because the claim is that it will not be fixed, and a deferral replaces the deadline with its own date. What is left is time passing with nothing said.

        The window comes from how urgent a finding is. Being known-exploited has its own and it is the shortest, whatever the severity says. Anything the reports did not rate takes the medium window.

        One row per issue at a component, however many places it sits at. `days_left` is negative once something is overdue.
      operationId: list-running-out
      parameters:
        - description: How far ahead to look
          explode: false
          in: query
          name: days
          schema:
            default: 14
            description: How far ahead to look
            format: int64
            maximum: 365
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyLateBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List findings running out of time that nobody has decided about
      tags:
        - Findings
  /v1/session:
    delete:
      description: Ends the session the request arrived on, everywhere rather than in this browser alone — the session is stored, so it stops working whichever copy of the application answers next.
      operationId: sign-out
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sign out
      tags:
        - Access
  /v1/session/me:
    get:
      description: |-
        Returns the caller, the products they can reach, and what they may do in each one.

        It answers what a screen has to know before it draws: whether to offer an action at all. Without it a client either hides nothing and lets people find the refusal, or re-implements the mapping from roles to capabilities and drifts from the one the server enforces.

        Capabilities, not roles, for that reason. Which roles produce which capability is the server's rule and stays there.
      operationId: get-current-subject
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Describe whoever is asking
      tags:
        - Access
  /v1/settings:
    get:
      description: |-
        Returns every setting an operator may change, its value, and what it decides. `default` means nobody has set it and the shipped value is in use.

        The shipped numbers are a starting point rather than a recommendation. What a deployment can hold to is a question about that deployment, and a deadline nobody agreed to produces an estate that is permanently late and a signal everybody ignores.
      operationId: list-settings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodySettingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List what this deployment has decided
      tags:
        - Administration
  /v1/settings/{name}:
    put:
      description: |-
        Sets one value for everybody here. Durations are written the way Go writes them — `72h`, `30m` — and a value that cannot be read is refused rather than stored, since a setting nothing can parse is a policy silently reverting to the shipped one.

        Only the settings this deployment recognizes may be set. A name it does not know is refused, because storing it would create something nothing ever reads.
      operationId: set-setting
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Set-settingRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change something for this deployment
      tags:
        - Administration
  /v1/sign-in:
    get:
      description: |-
        Returns the sign-in providers this deployment has configured, so a sign-in page can offer them.

        **Answered without a credential**, because it is what somebody sees before they have one. It is the only reading endpoint that is, and it reports names an operator configured and nothing else — no account exists or does not exist as far as this is concerned, which is the disclosure that would matter.
      operationId: list-sign-in-providers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyProviderBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the ways in
      tags:
        - Access
  /v1/tokens:
    get:
      description: |-
        Lists your own personal tokens: what each is called, when it expires and when it was last used. Never anybody else's, and never the secrets.

        A token is a live reference to you rather than a copy of what you could do when it was made, so what one reaches shrinks the moment your roles do.
      operationId: list-my-tokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyTokenBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List your API tokens
      tags:
        - Access
    post:
      description: |-
        Creates a personal token and returns its secret. The secret is shown once and never again — what is stored is a digest.

        Expiry is not optional, and `lifetime` may not exceed the ceiling an administrator has set. A credential that never runs out is one nobody ever revokes, and those are found when somebody leaves and nobody knows what breaks if it is turned off.
      operationId: mint-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create an API token
      tags:
        - Access
  /v1/tokens/{name}:
    delete:
      description: |-
        Revokes one of your own tokens by name. It stops working immediately.

        Yours alone. An administrator withdraws anybody else's through the administration paths.
      operationId: revoke-my-token
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke one of your API tokens
      tags:
        - Access
  /v1/trend:
    get:
      description: |-
        Returns the three counts per step, with open split by severity, across every product you can see.

        Three series rather than one, because separately they are three numbers and together they say whether the team is keeping pace: new consistently outrunning resolved is a growing backlog.

        Split by severity because a total that barely moves while its critical share rises is getting worse, and a single line hides exactly that.

        Worked out when it is asked for. Nothing is precomputed or refreshed on a schedule until a measurement says it has to be.
      operationId: get-trend
      parameters:
        - explode: false
          in: query
          name: weeks
          schema:
            default: 12
            format: int64
            maximum: 104
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyPointBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Show new, resolved and open over time
      tags:
        - Findings
  /v1/unassigned:
    get:
      description: |-
        Returns open findings with no assignee, across every product you can see, most urgent first.

        Deliberately not scoped to one product: work falling between people is exactly what hides when every screen shows one product and nobody looks at the others.
      operationId: list-unassigned
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List-unassignedResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List findings nobody is dealing with
      tags:
        - Findings
  /v1/version:
    get:
      description: Identifies the build that is answering, so an operator can tell which version they are looking at.
      operationId: get-version
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the server version
      tags:
        - Meta

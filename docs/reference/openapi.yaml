        previously_approved:
          description: This was agreed to before and came back
          type: boolean
        proposed_by:
          type: string
        reasoning:
          type: string
      required:
        - decision
        - place
        - reasoning
        - proposed_by
        - age_days
      type: object
info:
  description: Track vulnerabilities in the products you ship.
  title: OpenPSIRT
  version: dev
openapi: 3.1.0
paths:
  /v1/approval-batches/{batch}:
    delete:
      description: A reviewer may agree to a long selection in one action, so undoing has to be available at the same size. The claims stand; it is the agreement that is taken back.
      operationId: undo-batch
      parameters:
        - in: path
          name: batch
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Undo-batchResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Undo everything one agreement covered
      tags:
        - Triage
  /v1/decisions/{id}:
    delete:
      description: Needs no approval. Putting risk back on the table never does.
      operationId: withdraw-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Take a claim back
      tags:
        - Triage
  /v1/decisions/{id}/approval:
    post:
      description: The person who made a claim may never be the one who agrees to it, with no override — so a deployment with one person cannot approve anything, which is the control working rather than a gap in it. An agreement names one revision of the reasoning, so revising afterwards takes it back.
      operationId: approve-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Approve-decisionRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Agree to a claim
      tags:
        - Triage
  /v1/decisions/{id}/comments:
    post:
      description: A comment is not the reasoning and never disturbs an agreement. Annotating an approved decision months later is ordinary.
      operationId: comment-on-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Comment-on-decisionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment-on-decisionResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Say something about a decision
      tags:
        - Triage
  /v1/decisions/{id}/reasoning:
    put:
      description: "Keeps every revision and takes back any agreement standing on what it said before — a second person agreed to particular words, and different words are a claim nobody has agreed to. Needs no approval of its own: this puts risk back on the table rather than taking it off."
      operationId: revise-decision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Revise-decisionRequest"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: State the reasoning again
      tags:
        - Triage
  /v1/keys:
    get:
      description: "Which credentials exist, what each may send, when it was last used and whether it still works. The secrets are not here and cannot be: what is stored is a digest."
      operationId: list-keys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyKeyBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the pipeline credentials
      tags:
        - Administration
    post:
      description: "Creates a credential a build may send scans with, and returns its secret. The secret is shown once and stored hashed: a credential store that can hand back what it holds gives up every pipeline's key with a copy of the database."
      operationId: create-key
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredKeyBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Issue a pipeline credential
      tags:
        - Administration
  /v1/keys/{name}:
    delete:
      description: Stops it working, without removing the record of what it sent. Revoking one credential leaves every other pipeline running.
      operationId: revoke-key
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw a pipeline credential
      tags:
        - Administration
  /v1/people:
    get:
      description: "Everybody who may sign in, and what each of them holds. Nobody is here because they authenticated: access is granted in advance or not at all."
      operationId: list-people
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyPersonBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List who has been granted access
      tags:
        - Administration
    post:
      description: Records somebody so that they may sign in, and optionally what they hold. Recording the same person again confirms them and adds any roles named.
      operationId: record-person
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredPersonBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Grant somebody access
      tags:
        - Administration
  /v1/people/tokens:
    get:
      description: Stale tokens are otherwise found only when somebody leaves and nobody knows what breaks if they are turned off.
      operationId: list-all-tokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyTokenBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List everybody's personal credentials
      tags:
        - Administration
  /v1/people/{identity}/roles/{product}/{role}:
    delete:
      description: A grant is a statement about now. Withdrawing one removes it rather than marking it, because what somebody used to hold is answered by the record of what they did.
      operationId: withdraw-role
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: role
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Take a role away
      tags:
        - Administration
  /v1/people/{identity}/sessions:
    delete:
      description: Takes effect at once, whichever copy of the application answers next. Roles and group mappings are re-read at sign-in, so withdrawing one takes effect then; this is what makes somebody leaving immediate instead.
      operationId: end-sessions
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sign somebody out everywhere
      tags:
        - Administration
  /v1/people/{identity}/tokens/{name}:
    delete:
      description: An owner withdraws their own through the access paths. This is for the ones whose owner is no longer here to do it.
      operationId: revoke-anyones-token
      parameters:
        - in: path
          name: identity
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw somebody's personal credential
      tags:
        - Administration
  /v1/products:
    get:
      description: What a scan may be filed against. The first question after an upload is refused.
      operationId: list-products
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyProductBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List declared products
      tags:
        - Catalog
    post:
      description: Records a product so scans may be filed against it. Declaring one that already exists succeeds without changing anything, so this can run on every build.
      operationId: declare-product
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredProductBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Declare a product
      tags:
        - Catalog
  /v1/products/{product}/streams:
    get:
      operationId: list-streams
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyStreamBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List a product's branches and tags
      tags:
        - Catalog
    post:
      description: Records a line of a product. A branch moves and is rebuilt; a tag never changes and is what somebody received.
      operationId: declare-stream
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredStreamBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Declare a branch or a tag
      tags:
        - Catalog
  /v1/products/{product}/streams/{stream}/variants:
    get:
      description: A subset of what the product builds. A release predating a variant has never been filed against it, which is what keeps something introduced later from appearing to have shipped years ago.
      operationId: list-release-variants
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyVariantBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List what a release has been built as
      tags:
        - Catalog
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings:
    get:
      description: "One row per issue in a component, with the number of places it occupies. Not one row per place: a real image produced 335,021 findings and 305,487 of them were one kernel across the modules built against it, which is thousands of screens of rows differing in a column nobody reads. The places are what a decision gets recorded against."
      operationId: list-findings
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: How many to return
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: How many to return
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: How many to skip
          explode: false
          in: query
          name: offset
          schema:
            description: How many to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What is open against a build
      tags:
        - Findings
  /v1/products/{product}/streams/{stream}/variants/{variant}/findings/{vulnerability}/places/{place}/decision:
    post:
      description: One judgment about one issue in one component, at one place. It applies wherever the same code combination appears — including in later releases, which pick it up by looking it up rather than by copying it — and it stops applying when the code it was a claim about changes.
      operationId: decide
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: The issue, by any name it is known under
          in: path
          name: vulnerability
          required: true
          schema:
            description: The issue, by any name it is known under
            type: string
        - description: Which place, as the findings list gives it
          in: path
          name: place
          required: true
          schema:
            description: Which place, as the findings list gives it
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Decide about a finding
      tags:
        - Triage
  /v1/products/{product}/streams/{stream}/variants/{variant}/scans:
    get:
      description: Newest first. An upload is answered before its documents are read, so this is where a producer finds out whether they parsed. A key may read the uploads it sent itself and nothing else.
      operationId: list-scans
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
        - in: path
          name: stream
          required: true
          schema:
            type: string
        - in: path
          name: variant
          required: true
          schema:
            type: string
        - description: How many to return
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: How many to return
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: How many to skip
          explode: false
          in: query
          name: offset
          schema:
            description: How many to skip
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What has been filed against a build
      tags:
        - Ingest
    post:
      description: Takes a build's inventory and the suppressions it carries, against a product, stream and variant that have already been declared. The documents are read after the response, so a successful reply means they were accepted rather than that they parsed.
      operationId: upload-scan
      parameters:
        - description: The declared product this build is of
          in: path
          name: product
          required: true
          schema:
            description: The declared product this build is of
            type: string
        - description: The declared branch or tag
          in: path
          name: stream
          required: true
          schema:
            description: The declared branch or tag
            type: string
        - description: The declared way that stream is built
          in: path
          name: variant
          required: true
          schema:
            description: The declared way that stream is built
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              inventory:
                contentType: application/json,application/octet-stream
              suppressions:
                contentType: application/json,application/octet-stream
            schema:
              properties:
                inventory:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  format: binary
                  type: string
                suppressions:
                  items:
                    contentEncoding: binary
                    contentMediaType: application/octet-stream
                    format: binary
                    type: string
                  type: array
              required:
                - inventory
              type: object
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Send what a build shipped
      tags:
        - Ingest
  /v1/products/{product}/variants:
    get:
      operationId: list-variants
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyVariantBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List the ways a product is built
      tags:
        - Catalog
    post:
      description: "Records one of the parallel builds of a product — a chip variant, an architecture, an operating system. Declared once for the product, not once per release: a release is filed against it the first time a scan arrives, so nobody restates the list and no release ends up with the name spelled differently."
      operationId: declare-variant
      parameters:
        - in: path
          name: product
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclaredVariantBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Declare a way the product is built
      tags:
        - Catalog
  /v1/review-queue:
    get:
      description: Claims somebody has made that need a second person. Each row carries what an approver needs to judge it without opening it, because a list that has to be opened row by row is a list that gets approved unread.
      operationId: list-review-queue
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What is waiting to be agreed to
      tags:
        - Triage
  /v1/roles/bindings:
    delete:
      description: Takes effect at each member's next sign-in, because membership is read then and never again. To cut somebody off now, end their sessions.
      operationId: unbind-group
      parameters:
        - explode: false
          in: query
          name: group
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: product
          schema:
            type: string
        - explode: false
          in: query
          name: role
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Stop a group granting something
      tags:
        - Administration
    get:
      description: "The mappings that admit people in group-bound mode. In that mode a mapping is the advance authorization: somebody arriving for the first time in a mapped group is admitted, and somebody in none is refused."
      operationId: list-bindings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyBindingBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What each group grants
      tags:
        - Administration
    post:
      description: Administration is bound without a product, because it is global rather than held against one. Everything else names the product it applies to.
      operationId: bind-group
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindingBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Bind a group to a role
      tags:
        - Administration
  /v1/roles/mode:
    get:
      description: One mode for the whole deployment. A hybrid would need a precedence rule for somebody holding one role from a team and another directly, which is how a stale assignment outlives somebody's removal from the team it was shadowing.
      operationId: get-role-mode
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Where roles come from
      tags:
        - Administration
    put:
      description: Turning group binding on sets assignments aside rather than deleting them, and turning it off restores them — so trying it is not a one-way door. Refused if it would leave nobody able to administer this deployment.
      operationId: set-role-mode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModeBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change where roles come from
      tags:
        - Administration
  /v1/session:
    delete:
      description: Ends the session the request arrived on, everywhere rather than in this browser alone — the session is stored, so it stops working whichever copy of the application answers next.
      operationId: sign-out
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: End this session
      tags:
        - Access
  /v1/tokens:
    get:
      description: Yours alone. A token is a live reference to you rather than a copy of what you could do when it was made, so what it reaches shrinks the moment your roles do.
      operationId: list-my-tokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBodyTokenBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List your own credentials
      tags:
        - Access
    post:
      description: "Shown once. Expiry is not optional: a credential that never runs out is one nobody ever revokes, and those are found when somebody leaves and nobody knows what breaks if it is turned off."
      operationId: mint-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Mint yourself a credential
      tags:
        - Access
  /v1/tokens/{name}:
    delete:
      description: Yours alone. An administrator withdraws anybody's through the administration paths.
      operationId: revoke-my-token
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Withdraw one of your credentials
      tags:
        - Access
  /v1/version:
    get:
      description: Identifies the build that is answering, so an operator can tell which version they are looking at.
      operationId: get-version
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Report the running build
      tags:
        - Meta

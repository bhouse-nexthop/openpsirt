name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded run tells you nothing worth waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    # All four supported engines run the same suite. SQLite alone would catch
    # none of the portability traps the design is written around, so a green
    # run here is the only thing that makes "runs on four engines" a fact.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openpsirt
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: openpsirt
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -ptest --silent" --health-interval 5s
          --health-timeout 5s --health-retries 20
      # Deliberately below the floor, so the refusal is exercised. Without it
      # that test skips in every run, and the design claims it is proved.
      postgres-old:
        image: postgres:13-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openpsirt
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: openpsirt
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      OPENPSIRT_TEST_POSTGRES_URL: postgres://postgres:test@127.0.0.1:5432/openpsirt?sslmode=disable
      OPENPSIRT_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/openpsirt
      OPENPSIRT_TEST_MARIADB_URL: mariadb://root:test@127.0.0.1:3307/openpsirt
      OPENPSIRT_TEST_TOO_OLD_URL: postgres://postgres:test@127.0.0.1:5433/openpsirt?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      # -p 1: packages share the database servers above, and the rollback test
      # drops every table. Running them in parallel makes unrelated packages
      # fail depending on timing.
      - run: go test -race -count=1 -p 1 ./...
      - name: Confirm every engine was actually exercised
        # A skipped engine passes silently, which would make the matrix
        # decorative. This fails if any engine did not run.
        run: |
          go test ./internal/schema/ -count=1 -v -run TestMigrationsApplyOnEveryEngine \
            | tee /tmp/engines.txt
          for engine in sqlite postgres mysql mariadb; do
            grep -q "PASS: TestMigrationsApplyOnEveryEngine/$engine" /tmp/engines.txt \
              || { echo "::error::$engine did not run"; exit 1; }
          done
      - name: Confirm the version floor was exercised, not skipped
        # A skipped test passes. This one guards the claim that an unsupported
        # server is refused, so a silent skip would make the claim untrue.
        run: |
          go test ./internal/database/ -count=1 -v -run TestOpenRefuses | tee /tmp/floor.txt
          grep -q "PASS: TestOpenRefusesAServerBelowTheFloor" /tmp/floor.txt \
            || { echo "::error::the version floor test did not run"; exit 1; }
      - name: Confirm the migration lock was exercised, not skipped
        run: |
          go test ./internal/database/migrate/ -count=1 -v -run TestLockExcludes | tee /tmp/lock.txt
          for engine in postgres mysql mariadb; do
            grep -q "PASS: TestLockExcludesAnotherConnection/$engine" /tmp/lock.txt \
              || { echo "::error::the migration lock was not exercised on $engine"; exit 1; }
          done

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Pinned in the Makefile so CI and a developer run the same version. The
      # tool must be built with a Go at least as new as the code, or it cannot
      # read the compiler's export data.
      - run: make lint

  security:
    name: Vulnerabilities and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Known vulnerabilities in dependencies
        run: make govulncheck
      - name: Licenses of shipped dependencies
        run: make licenses

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          # Matches the license policy: permissive only for anything shipped.
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, MPL-2.0

  spec-current:
    name: OpenAPI document is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The document is generated from the running registrations. If the
      # committed copy differs, the API changed without it being regenerated.
      - run: make openapi
      - name: Fail if the committed document is stale
        run: git diff --exit-code -- docs/reference/openapi.yaml

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make sbom
      - uses: actions/upload-artifact@v4
        with:
          name: openpsirt-sbom
          path: bin/openpsirt.cdx.json
          if-no-files-found: error

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: openpsirt:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image must run and report itself
        run: docker run --rm openpsirt:ci -version
      - name: The image must not run as root
        # A container that needs no privileges should not have any, and this is
        # the only place that is actually checked rather than asserted.
        run: |
          uid=$(docker run --rm --entrypoint id openpsirt:ci -u)
          test "$uid" != "0" || { echo "::error::image runs as root"; exit 1; }
          echo "runs as uid $uid"

  chart:
    name: Helm chart renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/openpsirt --set database.url=postgres://u:p@h:5432/d
      - name: It must render valid manifests
        run: helm template t deploy/helm/openpsirt --set database.existingSecret=s --set ingress.enabled=true > /dev/null
      - name: It must refuse to render without a database
        # Rendering something unusable would be worse than failing here.
        run: |
          if helm template t deploy/helm/openpsirt >/dev/null 2>&1; then
            echo "::error::chart rendered with no database configured"; exit 1
          fi
          echo "refused as intended"

  docs:
    name: Documentation builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict

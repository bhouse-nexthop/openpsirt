name: CI

# bash with pipefail everywhere. GitHub's default shell is `bash -e`, which
# takes the *last* command's status in a pipeline — so `go test | tee` reports
# tee's status, which is always 0. The engine guards below pipe into tee, and
# without this they announce success over a failing suite. Measured, not
# assumed: the local gate had the same hole and passed a deliberately broken
# test.
defaults:
  run:
    shell: bash -euo pipefail {0}

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded run tells you nothing worth waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    # All four supported engines run the same suite. SQLite alone would catch
    # none of the portability traps the design is written around, so a green
    # run here is the only thing that makes "runs on four engines" a fact.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openpsirt
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: openpsirt
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -ptest --silent" --health-interval 5s
          --health-timeout 5s --health-retries 20
      # Deliberately below the floor, so the refusal is exercised. Without it
      # that test skips in every run, and the design claims it is proved.
      postgres-old:
        image: postgres:13-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openpsirt
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: openpsirt
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      OPENPSIRT_TEST_POSTGRES_URL: postgres://postgres:test@127.0.0.1:5432/openpsirt?sslmode=disable
      OPENPSIRT_TEST_MYSQL_URL: mysql://root:test@127.0.0.1:3306/openpsirt
      OPENPSIRT_TEST_MARIADB_URL: mariadb://root:test@127.0.0.1:3307/openpsirt
      OPENPSIRT_TEST_TOO_OLD_URL: postgres://postgres:test@127.0.0.1:5433/openpsirt?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make build
      - run: make vet
      - name: Confirm a developer's engines are the engines run here
        # The servers above are declared in this file and started locally by
        # "make engines-up", which pins the same versions. Two pinned lists
        # drift, and the drift is invisible exactly when it matters: a suite
        # green locally against an engine this job no longer runs proves
        # nothing about the one it does. The target compares the two lists in
        # both directions, so an engine added here and nowhere else is caught.
        run: make engines-check
      # The same target the local gate runs (CIG-05): every configured
      # engine, the race detector on, nothing cached, packages in parallel.
      # Each test binary has a database of its own on every server, so no
      # package can tear down another's tables.
      - run: make test-all
      - name: Confirm every engine ran, and that each was the engine it claimed
        # A skipped engine passes silently, which would make the matrix
        # decorative. The target greps each engine by name, and — because a
        # grep for a *label* only proves a subtest with that label ran, while
        # the connection comes from an environment variable — asks each server
        # what it is and compares that against the label. With the old server
        # configured above it also checks the version floor refused it rather
        # than skipped, and that the migration lock was exercised on each of
        # the three servers.
        run: make check-engines

  web:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          # The version the image builds the interface with.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # What "make check" runs for the interface: dependencies installed as
      # locked, the type check, its tests, and the generated client diffed
      # against the API document so the two cannot drift apart.
      - run: make web-check

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Pinned in the Makefile so CI and a developer run the same version. The
      # tool must be built with a Go at least as new as the code, or it cannot
      # read the compiler's export data.
      - run: make lint
      # Exported code nothing reaches. The analysis gate above only reports
      # unexported symbols, which left a store method with no route to it, a
      # renderer nothing rendered with, and a rule enforced in a second place
      # nothing called — all of it looking like working code.
      - run: make unreachable
      # Every decision in force is named by a design document. The chain is
      # code -> design -> decision, and a decision nothing describes is one
      # the code has quietly stopped following; local runs caught this and CI
      # did not, which is the wrong way round.
      - run: make unclaimed

  security:
    name: Vulnerabilities and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Known vulnerabilities in dependencies
        run: make govulncheck
      - name: Licenses of shipped dependencies
        run: make licenses

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          # Matches the license policy: permissive only for anything shipped.
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, MPL-2.0

  spec-current:
    name: OpenAPI document is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The document is generated from the running registrations. If the
      # committed copy differs, the API changed without it being regenerated.
      - run: make openapi
      # Both files the target writes. The privileges page is generated from
      # the same registrations, so checking only the specification let a stale
      # page describing the wrong permissions pass.
      - name: Fail if the committed documents are stale
        run: git diff --exit-code -- docs/reference/openapi.yaml docs/reference/privileges.md

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make sbom
      - uses: actions/upload-artifact@v4
        with:
          name: openpsirt-sbom
          path: bin/openpsirt.cdx.json
          if-no-files-found: error

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: openpsirt:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image must run and report itself
        run: docker run --rm openpsirt:ci -version
      - name: The image must not run as root
        # A container that needs no privileges should not have any, and this is
        # the only place that is actually checked rather than asserted.
        run: |
          uid=$(docker run --rm --entrypoint id openpsirt:ci -u)
          test "$uid" != "0" || { echo "::error::image runs as root"; exit 1; }
          echo "runs as uid $uid"
      - name: The image must serve the interface
        # The Go build embeds a git-ignored directory, so this job — which
        # builds from a clean checkout — produced an image with no interface in
        # it at all, and every other check here passed. The interface is built
        # inside the image now, and this is what says so.
        run: |
          id=$(docker run -d --rm -p 127.0.0.1:8099:8080 --tmpfs /tmp \
                 -e OPENPSIRT_DATABASE_URL="sqlite:///tmp/ci.db" \
                 -e OPENPSIRT_ADDR="0.0.0.0:8080" \
                 -e OPENPSIRT_PLAIN_HTTP=1 \
                 -e OPENPSIRT_BOOTSTRAP_ADMINS=ci openpsirt:ci)
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:8099/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/ | grep -qi '<!doctype html' \
            || { echo "::error::the image serves no interface: it was built without one"; exit 1; }
          echo "the image serves the interface it embeds"

  chart:
    name: Helm chart renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          helm lint deploy/helm/openpsirt --set database.url=postgres://u:p@h:5432/d \
            --set auth.bootstrapAdmins='{admin}' \
            --set auth.trustedHeader.name=X-Forwarded-User \
            --set auth.trustedHeader.sources='{10.0.0.0/8}'
      - name: It must render valid manifests
        run: |
          helm template t deploy/helm/openpsirt --set database.existingSecret=s \
            --set ingress.enabled=true --set auth.bootstrapAdmins='{admin}' \
            --set auth.baseURL=https://psirt.example.com \
            --set auth.oidc.issuer=https://id.example.com \
            --set auth.oidc.clientID=abc --set auth.oidc.clientSecret=shh > /dev/null
      - name: It must refuse to render anything that could not be used
        # Rendering something unusable would be worse than failing here. An
        # install nobody can sign into is unusable in exactly the same way as
        # one with no database — it starts, fails its own administration
        # check, and crash-loops with the reason in a log nobody is watching
        # yet.
        run: |
          refuses() {
            local what="$1"; shift
            if helm template t deploy/helm/openpsirt "$@" >/dev/null 2>&1; then
              echo "::error::chart rendered an install with $what"; exit 1
            fi
            echo "refused: $what"
          }
          refuses "no database" 
          refuses "nobody who can administer it" --set database.existingSecret=s
          refuses "no way to sign in" --set database.existingSecret=s \
            --set auth.bootstrapAdmins='{admin}'
          refuses "no address for a provider to return to" --set database.existingSecret=s \
            --set auth.bootstrapAdmins='{admin}' --set auth.oidc.issuer=https://id.example.com
          refuses "a trusted header anybody could set" --set database.existingSecret=s \
            --set auth.bootstrapAdmins='{admin}' --set auth.trustedHeader.name=X-User

  docs:
    name: Documentation builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict

{{- if and (not .Values.database.url) (not .Values.database.existingSecret) }}
{{- fail "set database.url or database.existingSecret: openpsirt needs a database" }}
{{- end }}
{{- if and .Values.database.url .Values.database.existingSecret }}
{{- fail "set database.url or database.existingSecret, not both" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openpsirt.fullname" . }}
  labels: {{- include "openpsirt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "openpsirt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "openpsirt.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openpsirt.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: openpsirt
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OPENPSIRT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openpsirt.databaseSecretName" . }}
                  key: {{ include "openpsirt.databaseSecretKey" . }}
            - name: OPENPSIRT_AUTO_MIGRATE
              value: {{ .Values.autoMigrate | quote }}
            - name: OPENPSIRT_LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: OPENPSIRT_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Migrations run before the service answers, so the startup probe has
          # to allow for one taking a long time. Giving up part way through
          # kills the pod and starts the migration over.
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          # Liveness asks whether the process is running. Restarting will not
          # fix an unreachable database, so it must not depend on one.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          # Readiness asks whether it can serve, which includes the database.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only, so anything wanting a scratch
            # path needs somewhere to put it.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
